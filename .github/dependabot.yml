version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/services/api"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      dev-dependencies:
        dependency-type: "development"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/services/web-app"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      dev-dependencies:
        dependency-type: "development"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

  # Базовые образы единственного Dockerfile в репозитории.
  - package-ecosystem: "docker"
    directory: "/deploy/all-in-one"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
