version: 2
updates:
  # uv, а не pip: зависимости бэкенда закреплены в uv.lock, и экосистема "pip"
  # его не обновляла — уязвимые версии копились до скана образа (Trivy).
  - package-ecosystem: "uv"
    directory: "/services/api"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      dev-dependencies:
        dependency-type: "development"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/services/web-app"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      dev-dependencies:
        dependency-type: "development"
    ignore:
      # Мажор TypeScript ждёт поддержки в typescript-eslint (7.0 он не умеет).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

  # Базовые образы единственного Dockerfile в репозитории.
  - package-ecosystem: "docker"
    directory: "/deploy/all-in-one"
    schedule:
      interval: "weekly"
      day: "monday"
    ignore:
      # Node — только LTS (чётные мажоры), вручную и вместе с node-version в ci.yml:
      # Dependabot предлагал нечётную 25, в которой уже нет corepack.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
