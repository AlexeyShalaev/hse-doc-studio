version: 2
updates:
  # uv, а не pip: зависимости бэкенда закреплены в uv.lock, и экосистема "pip"
  # его не обновляла — уязвимые версии копились до скана образа (Trivy).
  - package-ecosystem: "uv"
    directory: "/services/api"
    schedule:
      interval: "weekly"
      day: "monday"
    # Минорные и патчевые — одним PR в неделю на экосистему: по PR на пакет
    # выходили волны по пять штук, каждая со своим конфликтом в lock-файле.
    groups:
      dev-dependencies:
        dependency-type: "development"
      # Стек серверного режима (extra server) обновляется отдельным PR: связка SQLAlchemy,
      # asyncpg и alembic ломается вместе, и разбирать её удобнее отдельно от прочих минорных.
      server-stack:
        patterns: ["sqlalchemy", "asyncpg", "alembic", "boto3", "botocore", "argon2-cffi", "aiosmtplib", "authlib", "moto", "aiosmtpd"]
      minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/services/web-app"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      dev-dependencies:
        dependency-type: "development"
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Мажор TypeScript ждёт поддержки в typescript-eslint (7.0 он не умеет).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      # init и analyze обязаны быть одной версии: по отдельности CodeQL падает.
      codeql:
        patterns:
          - "github/codeql-action*"
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  # Базовые образы единственного Dockerfile в репозитории.
  - package-ecosystem: "docker"
    directory: "/deploy/all-in-one"
    schedule:
      interval: "weekly"
      day: "monday"
    ignore:
      # Node — только LTS (чётные мажоры), вручную и вместе с node-version в ci.yml:
      # Dependabot предлагал нечётную 25, в которой уже нет corepack.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      # Python — вручную: на свежем минорном выпуске части зависимостей ещё нет
      # колёс (lxml не собрался на 3.15), и образ не строится.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    open-pull-requests-limit: 5
