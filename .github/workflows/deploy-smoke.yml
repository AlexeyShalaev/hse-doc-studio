name: Deploy smoke

# Проверяет НЕ логику приложения (это делает ci.yml), а что СОБИРАЕМЫЙ образ реально
# запускается там и так, как его будут разворачивать:
#   Tier 0  валидация артефактов деплоя (hadolint / docker compose config)
#   Tier 1  образ стартует под compose на amd64 и отвечает на /health
#   Tier 1b серверный набор deploy/server проходит полный смоук Playwright (e2e/tests/full.spec.ts)
#   Tier 2  образ стартует на arm64 (эмуляция QEMU) — закрывает дыру publish.yml
#           (публикуем две архитектуры, а запускали бы только одну)
#   Tier 3  supply chain: скан образа на CVE (Trivy) + SBOM (syft)
#
# Образ Linux-only (в контейнере всегда Linux), поэтому весь реальный boot идёт на ubuntu.
# «Разные ОС» для контейнера сводятся к АРХИТЕКТУРЕ: Windows/Linux-ПК — amd64,
# Mac на Apple Silicon — arm64. Поднять Linux-образ на macos-/windows-раннере нельзя:
# на macOS-раннерах нет демона Docker, а windows-раннеры крутят Windows-контейнеры.
#
# Не required-статус в branch protection (required — sentinel из ci.yml): джобы тяжёлые
# (TeX-less, но node-сборка + QEMU) и отфильтрованы по путям.

on:
  push:
    branches: [master]
    paths: &paths
      - "deploy/**"
      - "services/**"
      - "packs/**"
      - "scripts/**/*.compose.yml"
      - "scripts/dev/server-stack/**"
      - "e2e/**"
      - ".dockerignore"
      - ".hadolint.yaml"
      - ".github/workflows/deploy-smoke.yml"
  pull_request:
    branches: [master]
    paths: *paths
  workflow_dispatch:

concurrency:
  group: deploy-smoke-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # Совпадает с image в deploy/all-in-one/docker-compose.yml (lowercase, как требует GHCR).
  IMAGE: ghcr.io/alexeyshalaev/hse-doc-studio
  CI_TAG: ci

jobs:
  # ── Tier 0 — статическая валидация артефактов деплоя (без запуска контейнеров) ──
  validate:
    name: Validate Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Единственный Dockerfile в репозитории: из него собираются и публикуемый
      # образ (стадия production), и образ для docker-прогона тестов (стадия test).
      - name: Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: deploy/all-in-one/Dockerfile
          config: .hadolint.yaml
          failure-threshold: warning

  compose-config:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose files
        run: |
          set -euo pipefail
          # Проверяем только синтаксис/интерполяцию — контейнеры не поднимаем.
          # База и каждый оверлей поверх неё: именно так их применяют пользователи.
          docker compose -f deploy/all-in-one/docker-compose.yml config -q
          docker compose -f deploy/all-in-one/docker-compose.yml \
                         -f deploy/all-in-one/compose.build.yml config -q
          PROJECTS_HOST_PATH=/tmp/projects docker compose \
                         -f deploy/all-in-one/docker-compose.yml \
                         -f deploy/all-in-one/compose.projects.yml config -q
          # Без PROJECTS_HOST_PATH оверлей обязан падать с понятной ошибкой (guard :?).
          if (unset PROJECTS_HOST_PATH; docker compose -f deploy/all-in-one/docker-compose.yml \
                -f deploy/all-in-one/compose.projects.yml config -q 2>/dev/null); then
            echo "::error::compose.projects.yml не требует PROJECTS_HOST_PATH — guard сломан"; exit 1
          fi
          SYSTEM_FONTS_PATH=/usr/share/fonts docker compose \
                         -f deploy/all-in-one/docker-compose.yml \
                         -f deploy/all-in-one/compose.system-fonts.yml config -q
          if (unset SYSTEM_FONTS_PATH; docker compose -f deploy/all-in-one/docker-compose.yml \
                -f deploy/all-in-one/compose.system-fonts.yml config -q 2>/dev/null); then
            echo "::error::compose.system-fonts.yml не требует SYSTEM_FONTS_PATH — guard сломан"; exit 1
          fi
          # Серверный набор: обязательные значения подставляет .env.example с заглушками, затем все профили.
          sed -E 's/^([A-Z0-9_]+)=$/\1=x/' deploy/server/.env.example > /tmp/server.env
          docker compose --env-file /tmp/server.env -f deploy/server/docker-compose.yml config -q
          docker compose --env-file /tmp/server.env -f deploy/server/docker-compose.yml \
                         --profile services --profile ai config -q
          docker compose --env-file /tmp/server.env -f deploy/server/docker-compose.yml \
                         -f deploy/server/compose.smoke.yml config -q
          # Без обязательных значений набор обязан падать с понятной ошибкой.
          if docker compose --env-file /dev/null -f deploy/server/docker-compose.yml config -q 2>/dev/null; then
            echo "::error::deploy/server не требует обязательных секретов"; exit 1
          fi
          docker compose -p dev \
            -f scripts/dev/infra.compose.yml \
            -f scripts/dev/services/api.compose.yml \
            --profile all config -q
          docker compose -p tests \
            -f scripts/tests/infra.compose.yml \
            -f scripts/tests/tests.compose.yml \
            --profile api-tests config -q
          echo "✅ все compose-файлы валидны"

  # ── Собираем образ ОДИН раз (amd64) и передаём артефактом в smoke- и scan-джобы ──
  build:
    name: Build image (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Third-party actions запинены на commit-SHA (supply-chain); комментарий # vX — для Dependabot.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build & load
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/all-in-one/Dockerfile
          target: production
          load: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ env.CI_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image
        run: docker save -o image.tar "$IMAGE:$CI_TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: hse-studio-image
          path: image.tar
          retention-days: 1

  # ── Tier 1 — образ реально стартует в all-in-one топологии ──
  compose-smoke:
    name: Compose smoke (amd64)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: hse-studio-image
      - name: Load image
        run: docker load -i image.tar

      - name: Up & smoke
        working-directory: deploy/all-in-one
        run: |
          set -euo pipefail
          # Локальный образ уже в docker (загружен из артефакта) → compose его не тянет.
          {
            echo "TAG=$CI_TAG"
            echo "PORT=17240"
            echo "DATA_DIR=./data"
          } > .env
          # Каталог данных создаём заранее: иначе docker сделает его от root, а процесс
          # в контейнере работает под непривилегированным `app` и не сможет туда писать.
          mkdir -p data && chmod 777 data
          docker compose up -d

          echo "жду /health…"
          ok=0
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:17240/health >/dev/null 2>&1 && { ok=1; break; }
            sleep 3
          done
          [ "$ok" = 1 ] || { echo "::error::/health не поднялся"; docker compose logs --no-color; exit 1; }

          # Данные, которые едут в образ отдельными COPY (пак шаблонов и заметки о
          # релизах), /health не проверяет: без них приложение стартует, но пустеет
          # «Что нового» и не создаётся ни один проект. Ловим это здесь, на PR.
          notes=$(curl -fsS http://127.0.0.1:17240/api/v1/system/release-notes || echo '{}')
          echo "$notes" | grep -q '"version"' || {
            echo "::error::release-notes.json не доехал в образ: $notes"
            docker compose logs --no-color; exit 1; }

          echo "✅ all-in-one стартует под compose"

      - name: Teardown
        if: always()
        working-directory: deploy/all-in-one
        run: docker compose down -v || true

  # ── Tier 1b — полный серверный набор (deploy/server) проходит приёмочный смоук Playwright ──
  # Мастер, регистрация, изоляция, сборка и PDF через раннер и MinIO, очередь 15 против 1, потеря раннера,
  # рестарт api, лимит квоты. Образ собирается с extra server: без него режим server не стартует.
  server-stack-smoke:
    name: Server stack smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build server image & load
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/all-in-one/Dockerfile
          target: production
          build-args: BACKEND_EXTRAS=--extra server
          load: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ env.CI_TAG }}
          cache-from: type=gha,scope=server-stack
          cache-to: type=gha,mode=max,scope=server-stack

      - name: Stand up
        run: |
          set -euo pipefail
          export TAG="$CI_TAG"
          export DOCKER_GID="$(stat -c '%g' /var/run/docker.sock)"
          scripts/dev/server-stack/stack.sh up

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml

      - name: Install Playwright
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
        working-directory: e2e

      - name: Run full smoke
        run: |
          eval "$(scripts/dev/server-stack/stack.sh env)"
          pnpm exec playwright test --project=full
        working-directory: e2e

      - name: Stand logs on failure
        if: failure()
        run: |
          for service in api runner postgres minio; do
            echo "::group::$service"; scripts/dev/server-stack/stack.sh logs "$service" | tail -300; echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: server-stack-screenshots
          path: e2e/screenshots
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: server-stack-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore

      - name: Stand down
        if: always()
        run: scripts/dev/server-stack/stack.sh down

  # ── Tier 3 — supply chain: уязвимости и состав образа ──
  image-scan:
    name: Vulnerability scan & SBOM
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: hse-studio-image
      - name: Load image
        run: docker load -i image.tar

      - name: Trivy (HIGH/CRITICAL, fixable)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.CI_TAG }}
          format: table
          exit-code: "1"
          # ignore-unfixed: падать только на том, что реально можно починить бампом базы.
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: SBOM (syft, SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}:${{ env.CI_TAG }}
          format: spdx-json
          artifact-name: hse-studio-sbom.spdx.json

  # ── Tier 2 — образ стартует на arm64 (Apple Silicon). Тяжело (QEMU) → только push/manual ──
  arm64-smoke:
    name: arm64 boot (QEMU)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Своя сборка, а не артефакт из build: там amd64, а нам нужна другая платформа.
      - name: Build arm64 & load
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/all-in-one/Dockerfile
          target: production
          load: true
          platforms: linux/arm64
          tags: ${{ env.IMAGE }}:${{ env.CI_TAG }}-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Import check (нативные колёса под arm64)
        # Дешёвый и точный сигнал: если у пакета с C-расширением нет arm64-колеса и
        # сборка из исходников тихо не собралась, падаем здесь, а не у пользователя.
        run: |
          docker run --rm --platform linux/arm64 "$IMAGE:$CI_TAG-arm64" python -c "
          import cryptography, orjson, pydantic_core, psutil, reportlab, pypdf, pyhanko, PIL, uvloop
          import hse_doc_studio
          print('arm64 imports OK', hse_doc_studio.__version__)"

      - name: Docker CLI внутри образа — той же архитектуры
        # Ради этого и заведён TARGETARCH в Dockerfile: хардкод x86_64 дал бы здесь
        # Exec format error, и sibling-контейнеры для компиляции не запускались бы.
        run: docker run --rm --platform linux/arm64 "$IMAGE:$CI_TAG-arm64" docker --version

      - name: Boot & smoke (arm64 под QEMU)
        working-directory: deploy/all-in-one
        run: |
          set -euo pipefail
          {
            echo "TAG=$CI_TAG-arm64"
            echo "PORT=17240"
            echo "DATA_DIR=./data"
          } > .env
          mkdir -p data && chmod 777 data
          docker compose up -d
          echo "жду /health (эмуляция arm64 медленнее — до ~5 мин)…"
          ok=0
          for _ in $(seq 1 100); do
            curl -fsS http://127.0.0.1:17240/health >/dev/null 2>&1 && { ok=1; break; }
            sleep 3
          done
          [ "$ok" = 1 ] || { echo "::error::arm64 /health timeout"; docker compose logs --no-color; exit 1; }
          echo "✅ arm64 (QEMU): boot + health OK"

      - name: Teardown
        if: always()
        working-directory: deploy/all-in-one
        run: docker compose down -v || true

  # ── Sentinel: одна точка агрегации (можно повесить в branch protection при желании) ──
  deploy-smoke-passed:
    name: Deploy smoke passed
    if: always()
    needs: [validate, compose-config, build, compose-smoke, server-stack-smoke, image-scan, arm64-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Verify
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "Одна или несколько smoke-проверок упали."
            exit 1
          fi
          echo "Все smoke-проверки прошли (пропущенные джобы — норма для PR)."
