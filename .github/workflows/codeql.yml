name: CodeQL

on:
  push:
    branches: [master, next]
  pull_request:
    branches: [master, next]
  schedule:
    - cron: "27 3 * * 1" # еженедельно, пн 03:27 UTC

permissions:
  contents: read

# PR: новый push отменяет ещё идущий анализ того же PR. Push и расписание: своя группа на прогон, без отмены.
# Фильтра путей нет: Analyze (python) и Analyze (javascript-typescript) — required-статусы, а пропущенный
# матричный джоб не отдаёт статус с этим именем. Анализ идёт ~1.5 минуты, экономить на нём нечего.
concurrency:
  group: codeql-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      # codeql-action запинен на commit-SHA (# v3 — маркер для Dependabot).
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
