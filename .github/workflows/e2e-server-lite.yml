name: E2E server-lite

# Приёмка M1 на реальном стенде: образ приложения в режиме server и Postgres в compose, данные заливает seed,
# Playwright проходит вход, список своих проектов, создание проекта и изоляцию второго пользователя
# на двух языках интерфейса. Скриншоты ru/en лежат в артефакте e2e-screenshots.
#
# Не required-статус (required — sentinel из ci.yml): джоб собирает образ целиком и идёт
# только когда меняются код сервера, стенд или сами тесты.
#
# Сценарии делят одну базу стенда и идут в один воркер, поэтому параллельность здесь только между джобами:
# три шарда, у каждого свой стенд. Телефонный проект (~16 минут из ~20) делится по файлам по замеренной
# длительности; файл, не закреплённый ни за одним шардом, уходит в rest, так что новый сценарий не потеряется.
# Отчёты шардов сводит джоб report: один HTML-отчёт e2e-report и общий артефакт e2e-screenshots.

on:
  push:
    branches: [master]
    paths: &paths
      - "services/**"
      - "packs/**"
      - "contracts/server/**"
      - "deploy/all-in-one/**"
      - "scripts/dev/server-lite/**"
      - "scripts/dev/Makefile"
      - "e2e/**"
      - ".github/workflows/e2e-server-lite.yml"
  pull_request:
    branches: [master, next]
    paths: *paths
  workflow_dispatch:

concurrency:
  group: e2e-server-lite-${{ github.ref }}
  cancel-in-progress: true

env:
  # Телефонные файлы, закреплённые за шардами core и phone; остальные идут в rest. Длительности по прогону CI:
  # mobile-admin ~4.5 мин, mobile ~3.6, mobile-rare ~3.2, sidebar-overflow ~2.5, text-scale и stale-build по ~1.1.
  PHONE_CORE: "/text-scale.spec.ts /stale-build.spec.ts"
  PHONE_A: "/mobile-admin.spec.ts /sidebar-overflow.spec.ts"

jobs:
  e2e:
    name: M1 acceptance (Playwright, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # core: десктопные сценарии (~3.5 мин) и короткие телефонные; phone и rest: по ~7 минут телефона.
        shard: [core, phone, rest]
    env:
      BLOB_DIR: ${{ github.workspace }}/e2e/blob-report
    steps:
      - uses: actions/checkout@v7

      - name: Stand up
        run: make server-lite-up

      - name: Seed demo data
        run: make server-lite-seed

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml

      # Браузер из кэша по версии Playwright (она в lock-файле); системные зависимости ставятся всегда.
      - name: Playwright browsers cache
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/pnpm-lock.yaml') }}

      - name: Install Playwright
        run: |
          pnpm install --frozen-lockfile
          if [[ "${{ steps.browsers.outputs.cache-hit }}" == "true" ]]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi
        working-directory: e2e

      - name: Typecheck
        if: matrix.shard == 'core'
        run: pnpm typecheck
        working-directory: e2e

      # Каждый запуск пишет blob-отчёт в свой каталог: reporter чистит каталог перед записью.
      - name: Run scenarios
        if: matrix.shard == 'core'
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: ${{ env.BLOB_DIR }}/m1
        run: make e2e-m1

      - name: Landing page
        if: matrix.shard == 'core'
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: ${{ env.BLOB_DIR }}/landing
        run: make e2e-landing

      - name: Model servers admin page (mocked API)
        if: matrix.shard == 'core'
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: ${{ env.BLOB_DIR }}/model-servers
        run: make e2e-model-servers

      - name: Passkeys (virtual authenticator)
        if: matrix.shard == 'core'
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: ${{ env.BLOB_DIR }}/passkeys
        run: make e2e-passkeys

      - name: Runner install commands
        if: matrix.shard == 'core'
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: ${{ env.BLOB_DIR }}/runner-install
        run: make e2e-runner-install

      # Файлы телефонного проекта для этого шарда; rest берёт всё, что не закреплено за core и phone.
      - name: Phone layout files
        id: phone
        working-directory: e2e
        run: |
          case "${{ matrix.shard }}" in
            core) files="$PHONE_CORE" ;;
            phone) files="$PHONE_A" ;;
            rest)
              files=""
              for f in $(pnpm exec playwright test --project=mobile --list --reporter=json | jq -r '[.suites[].file] | unique | .[]'); do
                case " $PHONE_CORE $PHONE_A " in *" /$f "*) ;; *) files="$files /$f" ;; esac
              done
              ;;
          esac
          files="$(echo $files)"
          test -n "$files" || { echo "::error::нет телефонных файлов для шарда ${{ matrix.shard }}"; exit 1; }
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Phone files: $files"

      - name: Phone layout
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: ${{ env.BLOB_DIR }}/mobile
        run: make e2e-mobile E2E_MOBILE_FILES="${{ steps.phone.outputs.files }}"

      - name: Stand logs on failure
        if: failure()
        run: docker compose -p hse-doc-studio-server-lite -f scripts/dev/server-lite/compose.yml --env-file scripts/dev/server-lite/.env logs --no-color --tail 300

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: e2e-screenshots-${{ matrix.shard }}
          path: e2e/screenshots
          if-no-files-found: warn
          retention-days: 1

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: e2e-blob-${{ matrix.shard }}
          path: e2e/blob-report
          if-no-files-found: ignore
          retention-days: 1

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-report-${{ matrix.shard }}
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore

      - name: Stand down
        if: always()
        run: docker compose -p hse-doc-studio-server-lite -f scripts/dev/server-lite/compose.yml --env-file scripts/dev/server-lite/.env --profile seed down --volumes --remove-orphans

  # Сводка шардов: один HTML-отчёт по всем сценариям и все скриншоты одним артефактом, как до деления.
  report:
    name: M1 acceptance report
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: e2e
      - uses: actions/download-artifact@v8
        with:
          pattern: e2e-blob-*
          path: e2e/all-blob
      - uses: actions/download-artifact@v8
        with:
          pattern: e2e-screenshots-*
          merge-multiple: true
          path: e2e/screenshots
      # Имена blob-файлов разных запусков могут совпасть, поэтому путь шарда и запуска входит в имя.
      - name: Merge reports
        working-directory: e2e
        run: |
          mkdir -p blob-flat
          find all-blob -name '*.zip' | while read -r zip; do
            rel="${zip#all-blob/}"
            cp "$zip" "blob-flat/${rel//\//-}"
          done
          ls -l blob-flat
          if [ -n "$(ls blob-flat)" ]; then
            pnpm exec playwright merge-reports --reporter html blob-flat
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: e2e/screenshots
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: e2e/playwright-report
          if-no-files-found: ignore
