name: E2E server-lite

# Приёмка M1 на реальном стенде: образ приложения в режиме server и Postgres в compose, данные заливает seed,
# Playwright проходит вход, список своих проектов, создание проекта и изоляцию второго пользователя
# на двух языках интерфейса. Скриншоты ru/en лежат в артефакте e2e-screenshots.
#
# Не required-статус (required — sentinel из ci.yml): джоб собирает образ целиком и идёт
# только когда меняются код сервера, стенд или сами тесты.
#
# Сценарии делят одну базу стенда и идут в один воркер, поэтому параллельность здесь только между джобами:
# семь шардов, у каждого свой стенд. Телефонный проект (~16 минут) делится по файлам по замеренной длительности;
# файл, не закреплённый ни за одним шардом, уходит в phone-main, так что новый сценарий не потеряется. Каждый шард несёт
# накладные расходы на стенд (~1,5 минуты) и приёмку M1 (~1,5 минуты), которую телефонные сценарии берут за основу, поэтому
# шардов семь, а не больше: каждый укладывается в ~8 минут. Студия шаблонов идёт после text-scale.spec.ts: тот сбрасывает
# размер текста аккаунта админа в явные 100%, и перетаскивание рамки в pack-studio.spec.ts от этого зависит (без сброса
# тест падает: тянуть рамку в диалоге «Во весь экран» не получается), поэтому они в одном шарде в прежнем порядке. Отчёты шардов сводит джоб report: один HTML-отчёт e2e-report
# и общий артефакт e2e-screenshots.
# Четыре телефонных шарда на PR идут, только если тронуты фронтенд, e2e или стенд (джоб plan); на push в master идут всегда.
# Маршрут подписания (signing-route, signing-snapshot, signing-dates, signing-deadlines и signing-presets.spec.ts, ~5 мин)
# идёт отдельным шардом: ему нужен общий раннер с поддельным TeX, а M1 проверяет стенд без раннеров.

on:
  push:
    branches: [master]
    paths: &paths
      - "services/**"
      - "packs/**"
      - "contracts/server/**"
      - "deploy/all-in-one/**"
      - "scripts/dev/server-lite/**"
      - "scripts/dev/Makefile"
      - "e2e/**"
      - ".github/workflows/e2e-server-lite.yml"
  pull_request:
    branches: [master, next]
    paths: *paths
  workflow_dispatch:

concurrency:
  group: e2e-server-lite-${{ github.ref }}
  cancel-in-progress: true

env:
  # Телефонные файлы, закреплённые за шардами; остальные идут в phone-main. Длительности по прогону CI:
  # mobile-admin ~4,5 мин, mobile ~3,6, mobile-rare ~3,2, sidebar-overflow ~2,5, text-scale и stale-build по ~1,1.
  PHONE_ADMIN: "/mobile-admin.spec.ts"
  PHONE_RARE: "/mobile-rare.spec.ts /stale-build.spec.ts"
  PHONE_OVERFLOW: "/sidebar-overflow.spec.ts"
  PHONE_SCALE: "/text-scale.spec.ts"

jobs:
  # Состав шардов. Телефонные шарды (~16 минут сценариев из ~24) нужны, когда менялся интерфейс (services/web-app),
  # сами сценарии или стенд; на PR с правкой только бэкенда идут десктопный шард и маршрут подписания.
  plan:
    name: Plan shards
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            phone:
              - "services/web-app/**"
              - "e2e/**"
              - "scripts/dev/server-lite/**"
              - "scripts/dev/Makefile"
              - ".github/workflows/e2e-server-lite.yml"
      - name: Matrix
        id: matrix
        env:
          PHONE: ${{ github.event_name != 'pull_request' || steps.filter.outputs.phone == 'true' }}
        run: |
          # phone: какие телефонные файлы идут в шарде (admin, main = всё не закреплённое, rare, overflow, scale, none);
          # m1: приёмка M1 перед сценариями (телефонные берут её результат за основу); desktop: лендинг, серверы моделей,
          # passkeys, команды раннера; studio: Студия шаблонов на моках; signing: маршрут подписания на общем раннере
          # с поддельным TeX; pdf: комментарии из превью PDF (тоже на раннере).
          base='[
            {"shard":"desktop","phone":"none","m1":true,"desktop":true,"studio":false,"signing":false,"pdf":false},
            {"shard":"studio","phone":"scale","m1":true,"desktop":false,"studio":true,"signing":false,"pdf":false},
            {"shard":"signing","phone":"none","m1":false,"desktop":false,"studio":false,"signing":true,"pdf":false}]'
          phone='[
            {"shard":"phone-admin","phone":"admin","m1":true,"desktop":false,"studio":false,"signing":false,"pdf":false},
            {"shard":"phone-main","phone":"main","m1":true,"desktop":false,"studio":false,"signing":false,"pdf":false},
            {"shard":"phone-rare","phone":"rare","m1":true,"desktop":false,"studio":false,"signing":false,"pdf":false},
            {"shard":"phone-overflow","phone":"overflow","m1":true,"desktop":false,"studio":false,"signing":false,"pdf":true}]'
          if [ "$PHONE" = true ]; then
            matrix="$(jq -c -n --argjson a "$base" --argjson b "$phone" '{include: ($a + $b)}')"
          else
            matrix="$(jq -c -n --argjson a "$base" '{include: $a}')"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  e2e:
    name: M1 acceptance (Playwright, ${{ matrix.shard }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      BLOB_DIR: ${{ github.workspace }}/e2e/blob-report
      # Образ собирается один раз шагом ниже (слои из кэша, общего с deploy-smoke), а стенд поднимается из него без
      # пересборки compose (SERVER_LITE_BUILD пуст: без --build).
      SERVER_LITE_IMAGE: hse-doc-studio-server-lite:ci
      SERVER_LITE_BUILD: ""
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Тот же образ (production, extra server), что собирает server-stack-smoke в deploy-smoke.yml: слои берутся из его
      # кэша (пишет только push в master). Без кэша это полная сборка, как раньше внутри compose.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/all-in-one/Dockerfile
          target: production
          build-args: BACKEND_EXTRAS=--extra server
          load: true
          platforms: linux/amd64
          tags: ${{ env.SERVER_LITE_IMAGE }}
          cache-from: type=gha,scope=server-stack

      - name: Stand up
        run: make server-lite-up

      - name: Seed demo data
        run: make server-lite-seed

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml

      # Браузер из кэша по версии Playwright (она в lock-файле); системные зависимости ставятся всегда.
      - name: Playwright browsers cache
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/pnpm-lock.yaml') }}

      - name: Install Playwright
        run: |
          pnpm install --frozen-lockfile
          if [[ "${{ steps.browsers.outputs.cache-hit }}" == "true" ]]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi
        working-directory: e2e

      - name: Typecheck
        if: matrix.desktop
        run: pnpm typecheck
        working-directory: e2e

      # Порядок как у прежнего последовательного прогона: M1, лендинг, телефон, затем остальные десктопные сценарии.
      # Телефонные сценарии рассчитаны на стенд после M1 (например, первым проектом Анны идёт созданный M1), поэтому
      # M1 идёт и в телефонных шардах; там его отчёт не попадает в сводный, чтобы не дублировать результаты.
      # Каждый запуск пишет blob-отчёт в свой каталог: reporter чистит каталог перед записью.
      - name: Run scenarios
        if: matrix.m1
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: ${{ matrix.desktop && format('{0}/m1', env.BLOB_DIR) || format('{0}/m1-prep', runner.temp) }}
        run: make e2e-m1

      - name: Landing page
        if: matrix.desktop
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: ${{ env.BLOB_DIR }}/landing
        run: make e2e-landing

      # Файлы телефонного проекта для этого шарда; phone-main берёт всё, что не закреплено за остальными.
      - name: Phone layout files
        id: phone
        if: matrix.phone != 'none'
        working-directory: e2e
        run: |
          case "${{ matrix.phone }}" in
            admin) files="$PHONE_ADMIN" ;;
            rare) files="$PHONE_RARE" ;;
            overflow) files="$PHONE_OVERFLOW" ;;
            scale) files="$PHONE_SCALE" ;;
            main)
              files=""
              for f in $(pnpm exec playwright test --project=mobile --list --reporter=json | jq -r '[.suites[].file] | unique | .[]'); do
                case " $PHONE_ADMIN $PHONE_RARE $PHONE_OVERFLOW $PHONE_SCALE " in *" /$f "*) ;; *) files="$files /$f" ;; esac
              done
              ;;
          esac
          files="$(echo $files)"
          test -n "$files" || { echo "::error::нет телефонных файлов для шарда ${{ matrix.shard }}"; exit 1; }
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Phone files: $files"

      - name: Phone layout
        if: matrix.phone != 'none'
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: ${{ env.BLOB_DIR }}/mobile
        run: make e2e-mobile E2E_MOBILE_FILES="${{ steps.phone.outputs.files }}"

      - name: Model servers admin page (mocked API)
        if: matrix.desktop
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: ${{ env.BLOB_DIR }}/model-servers
        run: make e2e-model-servers

      - name: Template Studio (admin switch, mocked workspaces)
        if: matrix.studio
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: ${{ env.BLOB_DIR }}/pack-studio
        run: make e2e-pack-studio

      - name: Passkeys (virtual authenticator)
        if: matrix.desktop
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: ${{ env.BLOB_DIR }}/passkeys
        run: make e2e-passkeys

      - name: Runner install commands
        if: matrix.desktop
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: ${{ env.BLOB_DIR }}/runner-install
        run: make e2e-runner-install

      # Цель поднимает общий раннер с поддельным TeX и гасит его после прогона. gpg для готовой открепленной подписи
      # академрука есть на раннере GitHub.
      - name: Signing route (fake-TeX runner, gpg)
        if: matrix.signing
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: ${{ env.BLOB_DIR }}/signing-route
        run: make e2e-signing-route

      # Тот же раннер с поддельным TeX: сборка печатает строки исходника и кладёт SyncTeX (~1,5 мин).
      - name: PDF preview comments (fake-TeX runner, SyncTeX)
        if: matrix.pdf || matrix.signing
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: ${{ env.BLOB_DIR }}/pdf-comments
        run: make e2e-pdf-comments

      - name: Stand logs on failure
        if: failure()
        run: docker compose -p hse-doc-studio-server-lite -f scripts/dev/server-lite/compose.yml --env-file scripts/dev/server-lite/.env --profile runner logs --no-color --tail 300

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: e2e-screenshots-${{ matrix.shard }}
          path: e2e/screenshots
          if-no-files-found: warn
          retention-days: 1

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: e2e-blob-${{ matrix.shard }}
          path: e2e/blob-report
          if-no-files-found: ignore
          retention-days: 1

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-report-${{ matrix.shard }}
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore

      - name: Stand down
        if: always()
        run: docker compose -p hse-doc-studio-server-lite -f scripts/dev/server-lite/compose.yml --env-file scripts/dev/server-lite/.env --profile seed --profile runner down --volumes --remove-orphans

  # Сводка шардов: один HTML-отчёт по всем сценариям и все скриншоты одним артефактом, как до деления.
  report:
    name: M1 acceptance report
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: e2e
      - uses: actions/download-artifact@v8
        with:
          pattern: e2e-blob-*
          path: e2e/all-blob
      - uses: actions/download-artifact@v8
        with:
          pattern: e2e-screenshots-*
          merge-multiple: true
          path: e2e/screenshots
      # Имена blob-файлов разных запусков могут совпасть, поэтому путь шарда и запуска входит в имя.
      - name: Merge reports
        working-directory: e2e
        run: |
          mkdir -p blob-flat
          find all-blob -name '*.zip' | while read -r zip; do
            rel="${zip#all-blob/}"
            cp "$zip" "blob-flat/${rel//\//-}"
          done
          ls -l blob-flat
          if [ -n "$(ls blob-flat)" ]; then
            pnpm exec playwright merge-reports --reporter html blob-flat
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: e2e/screenshots
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: e2e/playwright-report
          if-no-files-found: ignore
