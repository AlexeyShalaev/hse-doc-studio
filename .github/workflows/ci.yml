name: CI

on:
  push:
    branches: [master, next]
  pull_request:
    branches: [master, next]

# PR: новый push отменяет ещё идущий прогон того же PR. Push в master/next: у каждого коммита своя группа (run_id),
# ничего не отменяется и не вытесняется из очереди (одна группа без отмены всё равно выкинула бы ждущий прогон).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # ── Какие области задеты ─────────────────────────────────────────────────
  # На PR тяжёлые джобы идут только для задетых областей; на push в master/next идёт всё. Пропущенный по фильтру
  # джоб для all-checks-passed это успех, упавший или отменённый это провал.

  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.backend == 'true' }}
      tex: ${{ github.event_name != 'pull_request' || steps.filter.outputs.tex == 'true' }}
      frontend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true' }}
      user-docs: ${{ github.event_name != 'pull_request' || steps.filter.outputs.user_docs == 'true' }}
    steps:
      # Third-party actions запинены на commit-SHA (supply-chain); комментарий # vX — для Dependabot.
      # На pull_request список файлов берётся из API, checkout не нужен.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            workflow: &workflow
              - ".github/workflows/ci.yml"
            backend:
              - *workflow
              - "services/api/**"
              - "packs/**"
              - "contracts/**"
              - "deploy/**"
              - "scripts/**"
              # backend-lint сверяет заметки о релизе, CHANGELOG.md и справочник переменных окружения.
              - "release-notes.json"
              - "CHANGELOG.md"
              - "docs/ru/deploy/env-reference.md"
            # Сборка на настоящем TeX Live: код сборки и образ TeX по умолчанию (DEFAULT_IMAGE в executor).
            tex:
              - *workflow
              - "services/api/hse_doc_studio/infra/compile/**"
              - "services/api/hse_doc_studio/core/compile/**"
              - "services/api/hse_doc_studio/infra/docker/**"
              - "services/api/hse_doc_studio/infra/jobs/artifact_store.py"
              - "services/api/tests/integration/tex/**"
              - "services/api/pyproject.toml"
              - "services/api/uv.lock"
            frontend:
              - *workflow
              - "services/web-app/**"
              # Тесты фронта читают фикстуры и коды ошибок контрактов.
              - "contracts/**"
            # Справка сверяется с маршрутами приложения, а verified.sources статей могут указывать на любой файл
            # репозитория: удаление или переименование где угодно тоже повод для проверки (переименование
            # paths-filter отдаёт как удаление старого пути).
            user_docs:
              - *workflow
              - "services/user-docs/**"
              - "services/web-app/src/**"
              - deleted: "**"

  # ── Backend ──────────────────────────────────────────────────────────────
  # Остальные backend-джобы ждут backend-lint и пропускаются вместе с ним.

  backend-lint:
    name: Backend · Lint & type check
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          # Тот же интерпретатор, что в тестах и в публикуемом образе
          # (deploy/all-in-one/Dockerfile: python:3.14-slim-bookworm).
          python-version: "3.14"
      - name: Sync
        run: uv sync --frozen --extra dev --extra server
      - name: Ruff lint
        run: uv run ruff check
      - name: Ruff format
        run: uv run ruff format --check
      - name: Mypy
        run: uv run mypy hse_doc_studio
      # Справочник переменных окружения генерируется из Settings; поле без description тоже падает здесь.
      - name: Env reference in sync with Settings
        run: uv run --frozen --all-extras python ../../scripts/gen_env_reference.py --check
      # Гейт релиза: release-notes.json корректен, у версии из __init__.py есть
      # заметки, CHANGELOG.md им соответствует. Падает в релизном PR (там и бампится
      # версия), то есть ДО тега и публикации образа. Скрипту хватает stdlib.
      - name: Release notes valid and CHANGELOG.md in sync
        working-directory: .
        run: python3 scripts/gen_changelog.py --check

  # Быстрый прогон unit-тестов там, где реально исполняются платформенные ветки и нижняя граница Python.
  # Полный набор на ubuntu и py3.14 (с unit) идёт в backend-full, поэтому ubuntu/py3.14 здесь не повторяется.
  backend-test-unit:
    name: Backend · Unit (${{ matrix.os }}, py${{ matrix.python }})
    needs: backend-lint
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: services/api
    strategy:
      fail-fast: false
      # На PR — только ubuntu с нижней границей Python. На push в master
      # добавляются windows и macos: единственное место, где исполняются
      #   infra/fonts/system_fonts.py        win32-каталоги шрифтов
      #   infra/ai/ollama/hardware_probe.py  win32 + darwin/arm64 (Apple Silicon)
      #   infra/vcs/git_vcs_service.py       ветка os.name == "posix"
      #   uvloop; sys_platform != 'win32'    на Windows иной граф зависимостей
      #   tests/.../test_font_names.py       skipif снимается только на Windows
      matrix:
        include: >-
          ${{ github.event_name == 'pull_request'
              && fromJSON('[
                   {"os":"ubuntu-latest","python":"3.12"}]')
              || fromJSON('[
                   {"os":"ubuntu-latest","python":"3.12"},
                   {"os":"windows-latest","python":"3.14"},
                   {"os":"macos-latest","python":"3.14"}]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Sync
        run: uv sync --frozen --all-extras
      - name: Pytest (unit)
        run: uv run pytest -m unit --no-cov

  # Полный набор (unit + integration + pg на настоящем Postgres 16, включая миграции) — единственный источник
  # числа покрытия. Последовательно это ~42 минуты, поэтому набор делится на шарды по файлам (--shard, плагин
  # tests/fixtures/sharding.py), а внутри шарда тесты идут в 4 процесса pytest-xdist по числу vCPU раннера
  # (-n logical: -n auto считает физические ядра через psutil и на этом раннере даёт только 2);
  # worksteal: освободившийся процесс забирает хвост очереди у занятого, долгие файлы не держат шард в конце.
  # Данные покрытия шардов сводит backend-coverage, порог проверяется там.
  backend-full:
    name: Backend · Full suite (${{ matrix.shard }}/3)
    needs: backend-lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/api
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # Сервисы для pg и s3 тестов: без DSN pg-тесты пропускаются, но в CI они должны идти. Каждый процесс xdist
    # создаёт свою шаблонную базу и свою базу на тест (tests/fixtures/pg.py), общий сервер им не мешает.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      HSE_TEST_PG_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: Sync
        run: uv sync --frozen --all-extras
      # pg_dump/pg_restore той же версии, что сервис postgres:16: клиент новее сервера пишет в дамп настройки
      # (transaction_timeout), которых сервер не знает, а на раннере свой клиент другой версии. Берём клиент из
      # самого контейнера сервиса через docker exec: версия совпадает по построению, и нет установки из
      # apt.postgresql.org на каждом прогоне (curl 18/55 ронял джобу). Тест ищет клиент в /usr/lib/postgresql/<major>.
      - name: Postgres 16 client tools from the service container
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker_bin="$(command -v docker)"
          sudo install -d /usr/lib/postgresql/16/bin
          for tool in pg_dump pg_restore psql; do
            sudo rm -f "/usr/lib/postgresql/16/bin/$tool"
            printf '#!/bin/sh\nexec %s exec -i -e PGPASSWORD %s %s "$@"\n' "$docker_bin" "$PG_CONTAINER" "$tool" \
              | sudo tee "/usr/lib/postgresql/16/bin/$tool" >/dev/null
            sudo chmod 755 "/usr/lib/postgresql/16/bin/$tool"
          done
          /usr/lib/postgresql/16/bin/pg_dump --version
      - name: Pytest (shard ${{ matrix.shard }}/3)
        run: uv run pytest -n logical --dist worksteal --shard=${{ matrix.shard }}/3 --durations=15
      - name: Keep coverage data
        run: mkdir -p coverage-data && mv .coverage "coverage-data/.coverage.shard-${{ matrix.shard }}"
      - uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-${{ matrix.shard }}
          path: services/api/coverage-data
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # Сводное покрытие полного набора и порог.
  backend-coverage:
    name: Backend · Coverage
    needs: backend-full
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: Sync
        run: uv sync --frozen --extra test
      - uses: actions/download-artifact@v8
        with:
          pattern: backend-coverage-*
          merge-multiple: true
          path: services/api/coverage-data
      - name: Combine
        run: uv run coverage combine coverage-data
      # Порог = текущий факт (замерено 80% на полном прогоне). Взят на 2 пункта ниже:
      # часть строк — платформенные ветки win32/darwin, на ubuntu они не исполняются.
      # Поднимать по мере добавления тестов, цель — 90.
      - name: Report and threshold
        run: uv run coverage report --fail-under=78
      # Отчёт уходит и при пороге ниже нужного: в Codecov видно, где покрытие просело.
      - name: XML for Codecov
        if: ${{ !cancelled() }}
        run: uv run coverage xml -o coverage.xml
      - uses: codecov/codecov-action@v7
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: services/api/coverage.xml
          flags: backend
        continue-on-error: true

  # Локальный режим обязан работать без extra server: sqlalchemy, boto3 и прочие не установлены,
  # серверные тесты не собираются (tests/conftest.py). Тот же набор без серверной части, шарды и xdist как выше.
  backend-test-no-server:
    name: Backend · Local mode without server extra (${{ matrix.shard }}/2)
    needs: backend-lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/api
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: Sync
        run: uv sync --frozen --extra api --extra test
      - name: Pytest (without server extra, shard ${{ matrix.shard }}/2)
        run: uv run pytest -n logical --dist worksteal --shard=${{ matrix.shard }}/2 -m "not pg and not s3" --no-cov --durations=15

  # Исполнитель kubernetes раннера на настоящем кластере (kind): RBAC и NetworkPolicy из чарта, namespace подов
  # сборки с Pod Security restricted, поддельный образ TeX. Не входит в all-checks-passed (не обязательна).
  k8s-runner-kind:
    name: Runner · Kubernetes executor on kind
    needs: backend-lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KUBECONFIG: ${{ github.workspace }}/.kind/kubeconfig
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: Sync
        working-directory: services/api
        run: uv sync --frozen --extra api --extra kubernetes --extra test
      - name: Create kind cluster
        run: |
          mkdir -p .kind
          kind create cluster --name hds --kubeconfig "$KUBECONFIG" --wait 120s
      - name: Fake TeX image
        run: |
          docker build -t hds-fake-tex:ci services/api/tests/integration/k8s/fake-tex
          kind load docker-image hds-fake-tex:ci --name hds
      - name: Namespaces and RBAC from the chart
        run: |
          kubectl --kubeconfig "$KUBECONFIG" create namespace studio
          kubectl --kubeconfig "$KUBECONFIG" create namespace hds-builds
          kubectl --kubeconfig "$KUBECONFIG" label namespace hds-builds \
            pod-security.kubernetes.io/enforce=restricted pod-security.kubernetes.io/enforce-version=latest
          helm template rel deploy/helm/hse-doc-studio --namespace studio \
            -f deploy/helm/hse-doc-studio/ci/values-test.yaml -f deploy/helm/hse-doc-studio/ci/values-kubernetes.yaml \
            --show-only templates/runner-kubernetes.yaml > .kind/runner.yaml
          (cd services/api && uv run python ../../scripts/ci/k8s_runner_rbac.py ../../.kind/runner.yaml studio) > .kind/rbac.yaml
          kubectl --kubeconfig "$KUBECONFIG" apply -f .kind/rbac.yaml
      - name: Service account token and API address
        run: |
          kubectl --kubeconfig "$KUBECONFIG" create token rel-hse-doc-studio-runner -n studio --duration=1h > .kind/token
          kubectl --kubeconfig "$KUBECONFIG" config view --minify --raw \
            -o jsonpath='{.clusters[0].cluster.certificate-authority-data}' | base64 -d > .kind/ca.crt
          echo "HSE_TEST_K8S_API_URL=$(kubectl --kubeconfig "$KUBECONFIG" config view --minify -o jsonpath='{.clusters[0].cluster.server}')" >> "$GITHUB_ENV"
      - name: Role is minimal
        run: |
          as=system:serviceaccount:studio:rel-hse-doc-studio-runner
          test "$(kubectl --kubeconfig "$KUBECONFIG" auth can-i create pods -n hds-builds --as=$as)" = yes
          test "$(kubectl --kubeconfig "$KUBECONFIG" auth can-i create pods/exec -n hds-builds --as=$as)" = yes
          test "$(kubectl --kubeconfig "$KUBECONFIG" auth can-i get secrets -n hds-builds --as=$as || true)" = no
          test "$(kubectl --kubeconfig "$KUBECONFIG" auth can-i create pods -n studio --as=$as || true)" = no
      - name: Pytest (kind)
        working-directory: services/api
        env:
          HSE_TEST_K8S_TOKEN_FILE: ${{ github.workspace }}/.kind/token
          HSE_TEST_K8S_CA_FILE: ${{ github.workspace }}/.kind/ca.crt
          HSE_TEST_K8S_NAMESPACE: hds-builds
          HSE_TEST_K8S_IMAGE: hds-fake-tex:ci
        run: uv run pytest tests/integration/k8s -m k8s --no-cov
      # Встроенный Gotenberg чарта (services.officeConvert) в namespace с Pod Security restricted: под допускается,
      # проходит /health и конвертирует документ с корнем только для чтения (/tmp и домашний каталог в emptyDir).
      - name: Office convert under Pod Security restricted
        run: |
          kubectl --kubeconfig "$KUBECONFIG" create namespace hds-office
          kubectl --kubeconfig "$KUBECONFIG" label namespace hds-office \
            pod-security.kubernetes.io/enforce=restricted pod-security.kubernetes.io/enforce-version=latest
          helm template rel deploy/helm/hse-doc-studio --namespace hds-office \
            -f deploy/helm/hse-doc-studio/ci/values-test.yaml -f deploy/helm/hse-doc-studio/ci/values-office.yaml \
            --show-only templates/office-convert.yaml > .kind/office.yaml
          kubectl --kubeconfig "$KUBECONFIG" apply -n hds-office -f .kind/office.yaml
          kubectl --kubeconfig "$KUBECONFIG" -n hds-office rollout status deploy/rel-hse-doc-studio-office-convert --timeout=480s
          kubectl --kubeconfig "$KUBECONFIG" -n hds-office port-forward svc/rel-hse-doc-studio-office-convert 3000:3000 &
          printf 'HSE Doc Studio office convert check\n' > .kind/sample.txt
          curl -fsS --retry 10 --retry-connrefused --retry-delay 2 --max-time 180 \
            -F files=@.kind/sample.txt http://127.0.0.1:3000/forms/libreoffice/convert -o .kind/sample.pdf
          test "$(head -c 5 .kind/sample.pdf)" = "%PDF-"
          kill %1 || true
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl --kubeconfig "$KUBECONFIG" get pods -A -o wide || true
          kubectl --kubeconfig "$KUBECONFIG" get events -n hds-builds --sort-by=.lastTimestamp || true
          kubectl --kubeconfig "$KUBECONFIG" get events -n hds-office --sort-by=.lastTimestamp || true
          kubectl --kubeconfig "$KUBECONFIG" logs -n hds-office deploy/rel-hse-doc-studio-office-convert --tail=200 || true

  # Воспроизводимая сборка на настоящем TeX Live (образ раннеров по умолчанию): две сборки без изменений дают один
  # sha256, у другого раннера тоже. Образ весит гигабайты, поэтому джоба отдельная и не входит в all-checks-passed.
  tex-reproducible:
    name: Runner · Reproducible TeX build
    needs: [changes, backend-lint]
    if: needs.changes.outputs.tex == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: Sync
        run: uv sync --frozen --extra api --extra test
      - name: TeX Live image
        run: docker pull texlive/texlive:TL2024-historic
      - name: Pytest (tex)
        env:
          HSE_TEST_TEX_IMAGE: texlive/texlive:TL2024-historic
        run: uv run pytest tests/integration/tex -m tex --no-cov

  # ── Frontend ─────────────────────────────────────────────────────────────
  # Два джоба параллельно: статические проверки со сборкой и vitest. `pnpm install` берёт пакеты из кэша
  # setup-node (секунды), а vitest на 4 vCPU идёт ~6 минут, поэтому он ещё и делится на два шарда по файлам.

  frontend:
    name: Frontend · Lint, types & build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web-app
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          # Версия берётся из "packageManager" в package.json — один источник истины
          # с образом (deploy/all-in-one/Dockerfile: corepack prepare pnpm@9.15.4).
          package_json_file: services/web-app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: services/web-app/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint (ESLint)
        run: pnpm lint
      - name: Format check (Prettier)
        run: pnpm format:check
      # Ключи локализации: скрипт падает, если t('…') ссылается на несуществующий ключ.
      - name: i18n keys
        run: pnpm lint:i18n
      - name: Type check
        run: pnpm typecheck
      # Собираем здесь, а не только в publish.yml: иначе сломанная сборка фронта
      # обнаруживается уже на релизном теге, когда чинить поздно.
      - name: Build
        run: pnpm build
      # Админка в отдельном lazy-чанке: в entry и в экранах входа её кода нет,
      # а размеры основного бандла и чанка укладываются в бюджет.
      - name: Admin chunk isolation
        run: pnpm verify:admin-chunk
      - name: Bundle size
        run: pnpm bundlesize

  frontend-test:
    name: Frontend · Test (${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web-app
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: services/web-app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: services/web-app/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test (vitest, shard ${{ matrix.shard }}/2)
        run: pnpm test:coverage --shard=${{ matrix.shard }}/2
      # Codecov сводит загрузки шардов одного коммита с одним флагом в одно покрытие.
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: services/web-app/coverage/lcov.info
          flags: frontend
        continue-on-error: true

  # ── Пользовательская справка (services/user-docs) ──────────────────────
  # Сверка с приложением (маршруты help.routes, verified.sources, пары ru/en), сборка по
  # аудиториям и битые ссылки. Медиа здесь не снимаются: это ручная джоба user-docs-media.yml.

  user-docs:
    name: User help · Check, build & links
    needs: changes
    if: needs.changes.outputs.user-docs == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/user-docs
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: services/user-docs/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: services/user-docs/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check against the app
        run: node scripts/check.mjs
      - name: Build (user + admin)
        run: pnpm build
      - name: Broken links
        run: node scripts/check-links.mjs
      - name: No admin article in the user build
        run: |
          if grep -rl 'admin/runners' dist/user --include='*.json' --include='*.html'; then
            echo "Статья администратора попала в сборку пользователя"; exit 1
          fi

  # ── Sentinel — единственный required-статус в branch protection. ──────────
  # Список джобов правится здесь, а не в настройках репозитория. Джоб, пропущенный фильтром путей (или вслед
  # за пропущенным backend-lint), это успех; упавший или отменённый это провал. Если упал сам changes, все
  # зависимые пропускаются, но провал changes виден здесь же.

  all-checks-passed:
    name: All checks passed
    if: always()
    needs:
      - changes
      - backend-lint
      - backend-test-unit
      - backend-full
      - backend-coverage
      - backend-test-no-server
      - frontend
      - frontend-test
      - user-docs
    runs-on: ubuntu-latest
    steps:
      - name: Verify
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Results: $(echo "$RESULTS" | tr -d ' \n')"
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required checks failed."
            exit 1
          fi
          echo "All checks passed."
