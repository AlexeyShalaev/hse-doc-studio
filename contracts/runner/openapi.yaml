openapi: 3.0.3
info:
  title: Протокол раннера Студии
  version: "1"
  description: |
    Раннер сам забирает работу (pull) по HTTPS JSON; веб-сокетов нет. Регистрация идёт токеном
    регистрации, остальные вызовы токеном раннера (`Authorization: Bearer`), а вызовы по задаче
    дополнительно подписанным токеном задачи (`X-Job-Token`, из конверта). Каждый вызов по задаче
    несёт `attempt`; устаревшая попытка получает 409 `stale_attempt`, её выходы игнорируются.
    Раннер видит только блобы манифеста своей задачи. Ошибки имеют тело `RunnerErrorBody`
    с кодом из `x-error-codes` (тот же список в error_codes.json).
servers:
  - url: /api/runner/v1
x-error-codes:
  - runner_lost
  - superseded
  - superseded_by
  - no_runner
  - quota
  - stale_attempt
  - job_not_found
  - job_not_running
  - blob_forbidden
  - blob_missing
  - artifact_invalid
  - runner_unauthorized
  - runner_disabled
  - job_token_invalid
  - runner_protocol_unsupported
  - runner_limit
  - relay_request_gone
  - relay_out_of_order
  - relay_too_large
  - slow_down
x-defaults:
  lease_s: 45
  heartbeat_s: 10
  max_poll_wait_s: 25
paths:
  /register:
    post:
      operationId: registerRunner
      summary: Регистрация раннера, возможности и версия протокола.
      security: [{registrationToken: []}]
      requestBody: {$ref: '#/components/requestBodies/RunnerRegister'}
      responses:
        "200": {description: Раннер принят, content: {application/json: {schema: {$ref: '#/components/schemas/RunnerRegisterResponseBody'}}}}
        "401": {$ref: '#/components/responses/Error'}
        "409": {$ref: '#/components/responses/Error'}
  /poll:
    post:
      operationId: pollJob
      summary: Долгий опрос до 25 с; пустой конверт значит работы нет.
      security: [{runnerToken: []}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/PollRequestBody'}}}, required: true}
      responses:
        "200": {description: Конверт или пусто, content: {application/json: {schema: {$ref: '#/components/schemas/PollResponseBody'}}}}
        "401": {$ref: '#/components/responses/Error'}
  /jobs/{job_id}/heartbeat:
    post:
      operationId: heartbeatJob
      summary: Продлевает аренду; ответ доставляет отмену идущей задачи.
      security: [{runnerToken: [], jobToken: []}]
      parameters: [{$ref: '#/components/parameters/JobId'}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/HeartbeatRequestBody'}}}, required: true}
      responses:
        "200": {description: Аренда продлена, content: {application/json: {schema: {$ref: '#/components/schemas/HeartbeatResponseBody'}}}}
        "409": {$ref: '#/components/responses/Error'}
  /jobs/{job_id}/log:
    post:
      operationId: appendJobLog
      summary: Порция живого лога; повтор той же порции безвреден.
      security: [{runnerToken: [], jobToken: []}]
      parameters: [{$ref: '#/components/parameters/JobId'}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/LogBatchBody'}}}, required: true}
      responses:
        "204": {description: Принято}
        "409": {$ref: '#/components/responses/Error'}
  /jobs/{job_id}/blobs/need:
    post:
      operationId: needBlobs
      summary: Где взять нужные блобы манифеста; чужие блобы отклоняются.
      security: [{runnerToken: [], jobToken: []}]
      parameters: [{$ref: '#/components/parameters/JobId'}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/BlobNeedRequestBody'}}}, required: true}
      responses:
        "200": {description: Ссылки или прокси, content: {application/json: {schema: {$ref: '#/components/schemas/BlobNeedResponseBody'}}}}
        "403": {$ref: '#/components/responses/Error'}
  /jobs/{job_id}/blobs/{sha256}:
    get:
      operationId: getBlob
      summary: Содержимое блоба через API, когда подписанной ссылки нет.
      security: [{runnerToken: [], jobToken: []}]
      parameters: [{$ref: '#/components/parameters/JobId'}, {$ref: '#/components/parameters/Sha256'}]
      responses:
        "200": {description: Байты блоба, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
        "403": {$ref: '#/components/responses/Error'}
        "404": {$ref: '#/components/responses/Error'}
  /jobs/{job_id}/artifacts:
    post:
      operationId: announceArtifact
      summary: Заявка на загрузку выхода; в ответе ссылка или пусто для загрузки через API.
      security: [{runnerToken: [], jobToken: []}]
      parameters: [{$ref: '#/components/parameters/JobId'}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/ArtifactUploadRequestBody'}}}, required: true}
      responses:
        "200": {description: Куда грузить, content: {application/json: {schema: {$ref: '#/components/schemas/ArtifactUploadResponseBody'}}}}
        "422": {$ref: '#/components/responses/Error'}
  /jobs/{job_id}/artifacts/{sha256}:
    put:
      operationId: putArtifact
      summary: Загрузка выхода через API; хеш и размер проверяются по заявке.
      security: [{runnerToken: [], jobToken: []}]
      parameters: [{$ref: '#/components/parameters/JobId'}, {$ref: '#/components/parameters/Sha256'}]
      requestBody: {content: {application/octet-stream: {schema: {type: string, format: binary}}}, required: true}
      responses:
        "204": {description: Принято}
        "422": {$ref: '#/components/responses/Error'}
  /jobs/{job_id}/complete:
    post:
      operationId: completeJob
      summary: Итог попытки; устаревшая попытка получает 409.
      security: [{runnerToken: [], jobToken: []}]
      parameters: [{$ref: '#/components/parameters/JobId'}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/CompleteRequestBody'}}}, required: true}
      responses:
        "200": {description: Итог принят, content: {application/json: {schema: {$ref: '#/components/schemas/CompleteResponseBody'}}}}
        "409": {$ref: '#/components/responses/Error'}
  /announce:
    post:
      operationId: announceRunner
      summary: Возможности и описание раннера; ответ несёт пересечение возможностей. Старый сервер отвечает 404.
      security: [{runnerToken: []}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/RunnerAnnounceRequestBody'}}}, required: true}
      responses:
        "200": {description: Возможности согласованы, content: {application/json: {schema: {$ref: '#/components/schemas/RunnerAnnounceResponseBody'}}}}
        "401": {$ref: '#/components/responses/Error'}
        "403": {$ref: '#/components/responses/Error'}
  /offline:
    post:
      operationId: runnerOffline
      summary: Раннер уходит (мягкая остановка); сборки владельца сразу идут на общие.
      security: [{runnerToken: []}]
      responses:
        "204": {description: Принято}
        "401": {$ref: '#/components/responses/Error'}
  /deregister:
    post:
      operationId: deregisterRunner
      summary: Раннер отзывает сам себя (отключение от сервера).
      security: [{runnerToken: []}]
      responses:
        "204": {description: Отозван}
        "401": {$ref: '#/components/responses/Error'}
  /pair/start:
    post:
      operationId: startRunnerPairing
      summary: Сопряжение по коду устройства; человек подтверждает код на сайте.
      security: [{}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/RunnerPairStartRequestBody'}}}, required: true}
      responses:
        "200": {description: Код выдан, content: {application/json: {schema: {$ref: '#/components/schemas/RunnerPairStartResponseBody'}}}}
        "403": {$ref: '#/components/responses/Error'}
        "429": {$ref: '#/components/responses/Error'}
  /pair/poll:
    post:
      operationId: pollRunnerPairing
      summary: Опрос сопряжения не чаще interval; токен регистрации выдаётся один раз.
      security: [{}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/RunnerPairPollRequestBody'}}}, required: true}
      responses:
        "200": {description: Состояние сопряжения, content: {application/json: {schema: {$ref: '#/components/schemas/RunnerPairPollResponseBody'}}}}
        "429": {$ref: '#/components/responses/Error'}
  /jobs/{job_id}/relay/request:
    get:
      operationId: getRelayRequest
      summary: Тело запроса к модели задачи ai.relay; хеш в заголовке X-Relay-Sha256.
      security: [{runnerToken: [], jobToken: []}]
      parameters: [{$ref: '#/components/parameters/JobId'}]
      responses:
        "200": {description: Тело запроса, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
        "404": {$ref: '#/components/responses/Error'}
        "409": {$ref: '#/components/responses/Error'}
  /jobs/{job_id}/relay/events:
    post:
      operationId: postRelayEvents
      summary: Порция событий ответа модели; подтверждение доставляет отмену.
      security: [{runnerToken: [], jobToken: []}]
      parameters: [{$ref: '#/components/parameters/JobId'}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/RelayEventBatchBody'}}}, required: true}
      responses:
        "200": {description: Принято, content: {application/json: {schema: {$ref: '#/components/schemas/RelayEventAckBody'}}}}
        "409": {$ref: '#/components/responses/Error'}
        "413": {$ref: '#/components/responses/Error'}
components:
  schemas:
    ActorWire:
      additionalProperties: false
      properties:
        kind:
          enum:
          - local
          - user
          - guest
          type: string
        id:
          anyOf:
          - type: string
          - type: 'null'
        name:
          anyOf:
          - type: string
          - type: 'null'
        email:
          anyOf:
          - type: string
          - type: 'null'
        link_id:
          anyOf:
          - type: string
          - type: 'null'
        is_instance_admin:
          type: boolean
        source:
          anyOf:
          - enum:
            - session
            - pat
            - link
            - local
            type: string
          - type: 'null'
        scopes:
          items:
            type: string
          type: array
      required:
      - kind
      - id
      - name
      - email
      - link_id
      - is_instance_admin
      - source
      - scopes
      type: object
    ArtifactRefBody:
      additionalProperties: false
      properties:
        path:
          minLength: 1
          type: string
        sha256:
          pattern: ^[0-9a-f]{64}$
          type: string
        size:
          minimum: 0
          type: integer
      required:
      - path
      - sha256
      - size
      type: object
    ArtifactUploadRequestBody:
      additionalProperties: false
      properties:
        attempt:
          minimum: 1
          type: integer
        artifact:
          $ref: '#/components/schemas/ArtifactRefBody'
      required:
      - attempt
      - artifact
      type: object
    ArtifactUploadResponseBody:
      additionalProperties: false
      properties:
        url:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - url
      type: object
    BlobLocationBody:
      additionalProperties: false
      properties:
        sha256:
          pattern: ^[0-9a-f]{64}$
          type: string
        url:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - sha256
      - url
      type: object
    BlobNeedRequestBody:
      additionalProperties: false
      properties:
        attempt:
          minimum: 1
          type: integer
        sha256:
          items:
            type: string
          type: array
      required:
      - attempt
      - sha256
      type: object
    BlobNeedResponseBody:
      additionalProperties: false
      properties:
        blobs:
          items:
            $ref: '#/components/schemas/BlobLocationBody'
          type: array
      required:
      - blobs
      type: object
    CompleteRequestBody:
      additionalProperties: false
      properties:
        attempt:
          minimum: 1
          type: integer
        result:
          $ref: '#/components/schemas/JobResultWire'
        artifacts:
          items:
            $ref: '#/components/schemas/ArtifactRefBody'
          type: array
      required:
      - attempt
      - result
      - artifacts
      type: object
    CompleteResponseBody:
      additionalProperties: false
      properties:
        accepted:
          type: boolean
      required:
      - accepted
      type: object
    HeartbeatRequestBody:
      additionalProperties: false
      properties:
        attempt:
          minimum: 1
          type: integer
      required:
      - attempt
      type: object
    HeartbeatResponseBody:
      additionalProperties: false
      properties:
        cancel:
          type: boolean
        lease_until:
          format: date-time
          type: string
      required:
      - cancel
      - lease_until
      type: object
    JobEnvelopeBody:
      additionalProperties: false
      properties:
        spec:
          $ref: '#/components/schemas/JobSpecWire'
        manifest:
          items:
            $ref: '#/components/schemas/ManifestEntry'
          type: array
        timeout_s:
          exclusiveMinimum: 0
          type: number
        attempt:
          minimum: 1
          type: integer
        job_token:
          minLength: 1
          type: string
        actor_role:
          anyOf:
          - enum:
            - reader
            - reviewer
            - editor
            - owner
            type: string
          - type: 'null'
      required:
      - spec
      - manifest
      - timeout_s
      - attempt
      - job_token
      - actor_role
      type: object
    JobResultWire:
      additionalProperties: false
      properties:
        status:
          enum:
          - succeeded
          - failed
          - cancelled
          - timed_out
          type: string
        data:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
        error:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
      required:
      - status
      - data
      - error
      type: object
    JobSpecWire:
      additionalProperties: false
      properties:
        id:
          type: string
        kind:
          enum:
          - compile
          - office.convert
          - signature.verify_detached
          - pack.submission
          - ai.relay
          type: string
        tags:
          items:
            type: string
          type: array
        project_id:
          type: string
        actor:
          $ref: '#/components/schemas/ActorWire'
        locale:
          enum:
          - ru
          - en
          type: string
        payload:
          additionalProperties: true
          type: object
      required:
      - id
      - kind
      - tags
      - project_id
      - actor
      - locale
      - payload
      type: object
    LogBatchBody:
      additionalProperties: false
      properties:
        attempt:
          minimum: 1
          type: integer
        seq:
          minimum: 0
          type: integer
        lines:
          items:
            type: string
          type: array
      required:
      - attempt
      - seq
      - lines
      type: object
    ManifestEntry:
      additionalProperties: false
      properties:
        path:
          minLength: 1
          type: string
        sha256:
          pattern: ^[0-9a-f]{64}$
          type: string
        size:
          minimum: 0
          type: integer
      required:
      - path
      - sha256
      - size
      type: object
    PollRequestBody:
      additionalProperties: false
      properties:
        wait_s:
          maximum: 25
          minimum: 0
          type: integer
        free_slots:
          minimum: 0
          type: integer
        free_ai_slots:
          default: 0
          minimum: 0
          type: integer
      required:
      - wait_s
      - free_slots
      type: object
    PollResponseBody:
      additionalProperties: false
      properties:
        envelope:
          anyOf:
          - $ref: '#/components/schemas/JobEnvelopeBody'
          - type: 'null'
      required:
      - envelope
      type: object
    RunnerErrorBody:
      additionalProperties: false
      properties:
        detail:
          type: string
        code:
          type: string
      required:
      - detail
      - code
      type: object
    RunnerRegisterRequestBody:
      additionalProperties: false
      properties:
        name:
          minLength: 1
          type: string
        protocol:
          type: integer
        version:
          type: string
        tags:
          items:
            type: string
          type: array
        concurrency:
          minimum: 1
          type: integer
        resource_class:
          type: string
      required:
      - name
      - protocol
      - version
      - tags
      - concurrency
      - resource_class
      type: object
    RunnerRegisterResponseBody:
      additionalProperties: false
      properties:
        runner_id:
          type: string
        runner_token:
          type: string
        lease_s:
          type: integer
        heartbeat_s:
          type: integer
        max_poll_wait_s:
          type: integer
      required:
      - runner_id
      - runner_token
      - lease_s
      - heartbeat_s
      - max_poll_wait_s
      type: object
    AiEndpointDeclBody:
      additionalProperties: false
      properties:
        name:
          pattern: ^[a-z0-9][a-z0-9_-]{0,31}$
          type: string
        flavor:
          enum:
          - openai
          - ollama
          type: string
      required:
      - name
      - flavor
      type: object
    RelayEventAckBody:
      additionalProperties: false
      properties:
        cancel:
          type: boolean
      required:
      - cancel
      type: object
    RelayEventBatchBody:
      additionalProperties: false
      properties:
        attempt:
          minimum: 1
          type: integer
        seq:
          minimum: 0
          type: integer
        events:
          items:
            $ref: '#/components/schemas/RelayEventBody'
          maxItems: 64
          minItems: 1
          type: array
      required:
      - attempt
      - seq
      - events
      type: object
    RelayEventBody:
      additionalProperties: false
      properties:
        kind:
          enum:
          - head
          - data
          - end
          - error
          type: string
        status:
          anyOf:
          - maximum: 599
            minimum: 100
            type: integer
          - type: 'null'
        content_type:
          anyOf:
          - maxLength: 128
            type: string
          - type: 'null'
        data:
          anyOf:
          - minLength: 1
            type: string
          - type: 'null'
        code:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - kind
      - status
      - content_type
      - data
      - code
      type: object
    RunnerAnnounceRequestBody:
      additionalProperties: false
      properties:
        name:
          anyOf:
          - maxLength: 128
            minLength: 1
            type: string
          - type: 'null'
        version:
          type: string
        tags:
          items:
            type: string
          type: array
        concurrency:
          minimum: 1
          type: integer
        ai_concurrency:
          minimum: 0
          type: integer
        host_kind:
          enum:
          - cli
          - desktop
          type: string
        features:
          items:
            type: string
          type: array
        ai_endpoints:
          items:
            $ref: '#/components/schemas/AiEndpointDeclBody'
          maxItems: 16
          type: array
      required:
      - name
      - version
      - tags
      - concurrency
      - ai_concurrency
      - host_kind
      - features
      - ai_endpoints
      type: object
    RunnerAnnounceResponseBody:
      additionalProperties: false
      properties:
        runner_id:
          type: string
        server_features:
          items:
            type: string
          type: array
        owner_kind:
          enum:
          - instance
          - user
          type: string
        paused:
          type: boolean
        relay_keepalive_s:
          type: integer
      required:
      - runner_id
      - server_features
      - owner_kind
      - paused
      - relay_keepalive_s
      type: object
    RunnerPairPollRequestBody:
      additionalProperties: false
      properties:
        device_code:
          minLength: 1
          type: string
      required:
      - device_code
      type: object
    RunnerPairPollResponseBody:
      additionalProperties: false
      properties:
        status:
          enum:
          - pending
          - approved
          - denied
          - expired
          type: string
        registration_token:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - status
      - registration_token
      type: object
    RunnerPairStartRequestBody:
      additionalProperties: false
      properties:
        name:
          maxLength: 128
          minLength: 1
          type: string
        host_kind:
          enum:
          - cli
          - desktop
          type: string
      required:
      - name
      - host_kind
      type: object
    RunnerPairStartResponseBody:
      additionalProperties: false
      properties:
        device_code:
          type: string
        user_code:
          pattern: ^[BCDFGHJKLMNPQRSTVWXZ2-9]{4}-[BCDFGHJKLMNPQRSTVWXZ2-9]{4}$
          type: string
        verification_uri:
          type: string
        verification_uri_complete:
          type: string
        expires_in:
          type: integer
        interval:
          type: integer
      required:
      - device_code
      - user_code
      - verification_uri
      - verification_uri_complete
      - expires_in
      - interval
      type: object

  securitySchemes:
    registrationToken: {type: http, scheme: bearer}
    runnerToken: {type: http, scheme: bearer}
    jobToken: {type: apiKey, in: header, name: X-Job-Token}
  parameters:
    JobId: {name: job_id, in: path, required: true, schema: {type: string, format: uuid}}
    Sha256: {name: sha256, in: path, required: true, schema: {type: string, pattern: "^[0-9a-f]{64}$"}}
  requestBodies:
    RunnerRegister:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/RunnerRegisterRequestBody'}}}
  responses:
    Error:
      description: Отказ с кодом из x-error-codes
      content: {application/json: {schema: {$ref: '#/components/schemas/RunnerErrorBody'}}}
