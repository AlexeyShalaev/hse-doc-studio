# Сервисы для pg/s3-тестов этапа 2: Postgres и MinIO на нестандартных портах, чтобы не конфликтовать с локальными.
#   docker compose -f scripts/dev/compose.pg.yml up -d
#   HSE_TEST_PG_DSN=postgresql://postgres:postgres@localhost:15432/postgres make -C services/api test-pg
#   HSE_TEST_S3_ENDPOINT=http://localhost:19000 HSE_TEST_S3_ACCESS_KEY=minio HSE_TEST_S3_SECRET_KEY=minio-secret make -C services/api test-s3
name: hse-doc-studio-test-services

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --address ":9000"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-secret
    ports:
      - "127.0.0.1:19000:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20
    tmpfs:
      - /data
