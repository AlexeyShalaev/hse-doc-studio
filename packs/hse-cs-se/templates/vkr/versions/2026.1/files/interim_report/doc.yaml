# Манифест документа (bundle-раскладка v2): всё про документ — в этой папке.
# id = имя папки; языковые редакции — файлы-соседи <stem>.<код>.<ext>,
# файл без кода — единственная форма для всех языков. Пути source_file —
# в проектном пространстве (без суффиксов). Файл doc.yaml в проект не копируется.
#
# «Отчёт ВКР» — деливерабл КТ2 исследовательской (академической) ВКР
# (Инструкция по подготовке ВКР КТ2 2025/26): ГОСТ 7.32-2017, не менее
# 15–20 страниц со списком источников (>= 5), титул подписывают студент и
# руководитель. Несёт «проработанный Подход»: структурные части аннотации
# + экспериментальная база, описание данных, подход к экспериментам.
# НЕ текст ВКР (тот — id: thesis; главы 1–2 на КТ2 сдаёт проектный формат).
name:
