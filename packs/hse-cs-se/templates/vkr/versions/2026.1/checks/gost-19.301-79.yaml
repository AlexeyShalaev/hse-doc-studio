# packs/hse-cs-se/templates/vkr/versions/2026.1/checks/gost-19.301-79.yaml
# ГОСТ 19.301-79 — Программа и методика испытаний. Требования к содержанию и оформлению.

# label — короткая подпись группы в UI; ref — полная ссылка на документ.
label:
  ru: ГОСТ 19.301-79
  en: GOST 19.301-79
ref:
  ru: ГОСТ 19.301-79 §2
  en: GOST 19.301-79 §2
source:
  ru: Программа и методика испытаний. Требования к содержанию и оформлению.
  url: https://docs.cntd.ru/document/1200007651

rules:
  # ── Обязательные разделы ПМИ ──
  - id: gost-19.301-79/section-object
    title:       { ru: Раздел «Объект испытаний», en: "\"Test object\" section" }
    description: { ru: "ГОСТ 19.301-79 §2.1: ПМИ должна содержать раздел «Объект испытаний» с наименованием, областью применения и обозначением испытуемой программы.", en: "GOST 19.301-79 §2.1: the Test Program and Procedure must contain a \"Test object\" section with the name, field of application and designation of the program under test." }
    category:    structure
    applies_to:  [test_program_and_methodology, shared_test_program_and_methodology]
    default_severity: err
    engine: regex
    params:
      file_glob: "*test_program_and_methodology/*.tex"
      pattern: '(?i)\\section\*?\{[^}]*(?:[Оо]бъект|object)'
      negate: false
      message: { ru: "В ПМИ отсутствует раздел «Объект испытаний».", en: "The Test Program and Procedure is missing a \"Test object\" section." }

  - id: gost-19.301-79/section-purpose
    title:       { ru: Раздел «Цель испытаний», en: "\"Test objective\" section" }
    description: { ru: "ГОСТ 19.301-79 §2.2: ПМИ должна содержать раздел «Цель испытаний» с описанием цели проведения испытаний.", en: "GOST 19.301-79 §2.2: the Test Program and Procedure must contain a \"Test objective\" section describing the goal of the testing." }
    category:    structure
    applies_to:  [test_program_and_methodology, shared_test_program_and_methodology]
    default_severity: err
    engine: regex
    params:
      file_glob: "*test_program_and_methodology/*.tex"
      pattern: '(?i)\\section\*?\{[^}]*(?:[Цц]ел|objective|purpose)'
      negate: false
      message: { ru: "В ПМИ отсутствует раздел «Цель испытаний».", en: "The Test Program and Procedure is missing a \"Test objective\" section." }

  - id: gost-19.301-79/section-requirements
    title:       { ru: Раздел «Требования к программе», en: "\"Software requirements\" section" }
    description: { ru: "ГОСТ 19.301-79 §2.3: ПМИ должна содержать раздел «Требования к программе» — перечень требований из ТЗ, подлежащих проверке.", en: "GOST 19.301-79 §2.3: the Test Program and Procedure must contain a \"Software requirements\" section — the list of requirements from the Technical Specification subject to verification." }
    category:    structure
    applies_to:  [test_program_and_methodology, shared_test_program_and_methodology]
    default_severity: err
    engine: regex
    params:
      file_glob: "*test_program_and_methodology/*.tex"
      pattern: '(?i)\\section\*?\{[^}]*(?:[Тт]ребовани|requirements)'
      negate: false
      message: { ru: "В ПМИ отсутствует раздел «Требования к программе».", en: "The Test Program and Procedure is missing a \"Software requirements\" section." }

  - id: gost-19.301-79/section-doc-requirements
    title:       { ru: Раздел «Требования к программной документации», en: "\"Requirements for program documentation\" section" }
    description: { ru: "ГОСТ 19.301-79 §2.4: ПМИ должна содержать раздел «Требования к программной документации» — состав документации, предъявляемой на испытания.", en: "GOST 19.301-79 §2.4: the Test Program and Procedure must contain a \"Requirements for program documentation\" section — the set of documentation submitted for testing." }
    category:    structure
    applies_to:  [test_program_and_methodology, shared_test_program_and_methodology]
    default_severity: warn
    engine: regex
    params:
      file_glob: "*test_program_and_methodology/*.tex"
      pattern: '(?i)\\section\*?\{[^}]*(?:[Тт]ребовани|requirements)[^}]*(?:документ|documentation)'
      negate: false
      message: { ru: "В ПМИ отсутствует раздел «Требования к программной документации».", en: "The Test Program and Procedure is missing a \"Requirements for program documentation\" section." }

  - id: gost-19.301-79/section-means-and-order
    title:       { ru: Раздел «Средства и порядок испытаний», en: "\"Test resources and procedure\" section" }
    description: { ru: "ГОСТ 19.301-79 §2.5: ПМИ должна содержать раздел «Средства и порядок испытаний» с информацией о технических и программных средствах и порядке их проведения.", en: "GOST 19.301-79 §2.5: the Test Program and Procedure must contain a \"Test resources and procedure\" section with information on the hardware and software resources and the order of testing." }
    category:    structure
    applies_to:  [test_program_and_methodology, shared_test_program_and_methodology]
    default_severity: err
    engine: regex
    params:
      file_glob: "*test_program_and_methodology/*.tex"
      pattern: '(?i)\\section\*?\{[^}]*(?:[Сс]редства|facilities)'
      negate: false
      message: { ru: "В ПМИ отсутствует раздел «Средства и порядок испытаний».", en: "The Test Program and Procedure is missing a \"Test resources and procedure\" section." }

  - id: gost-19.301-79/section-methods
    title:       { ru: Раздел «Методы испытаний», en: "\"Test methods\" section" }
    description: { ru: "ГОСТ 19.301-79 §2.6: ПМИ должна содержать раздел «Методы испытаний» с описанием методов и конкретных проверок.", en: "GOST 19.301-79 §2.6: the Test Program and Procedure must contain a \"Test methods\" section describing the methods and specific checks." }
    category:    structure
    applies_to:  [test_program_and_methodology, shared_test_program_and_methodology]
    default_severity: err
    engine: regex
    params:
      file_glob: "*test_program_and_methodology/*.tex"
      pattern: '(?i)\\section\*?\{[^}]*(?:[Мм]ето[дт]|method)'
      negate: false
      message: { ru: "В ПМИ отсутствует раздел «Методы испытаний».", en: "The Test Program and Procedure is missing a \"Test methods\" section." }

  # ── Аннотация ──
  - id: gost-19.301-79/annotation
    title:       { ru: Аннотация документа, en: "Document abstract" }
    description: { ru: "ГОСТ 19.105-78 §2.5: каждый программный документ должен иметь аннотацию.", en: "GOST 19.105-78 §2.5: every program document must have an abstract." }
    category:    structure
    applies_to:  [test_program_and_methodology, shared_test_program_and_methodology]
    default_severity: warn
    engine: regex
    params:
      file_glob: "*test_program_and_methodology/*.tex"
      pattern: '(?i)\\section\*?\{[^}]*(?:[Аа]ннотаци|annotation|abstract)'
      negate: false
      message: { ru: "В ПМИ отсутствует раздел «Аннотация».", en: "The Test Program and Procedure is missing an \"Abstract\" section." }

  # ── Наличие матрицы трассировки (рекомендовано) ──
  - id: gost-19.301-79/traceability-matrix
    title:       { ru: Матрица трассировки требований, en: "Requirements traceability matrix" }
    description: { ru: "Рекомендуется включить матрицу трассировки требований к тест-кейсам в Приложение.", en: "It is recommended to include a requirements-to-test-cases traceability matrix in the Appendix." }
    category:    structure
    applies_to:  [test_program_and_methodology, shared_test_program_and_methodology]
    default_severity: info
    engine: regex
    params:
      file_glob: "*test_program_and_methodology/*.tex"
      pattern: '(?i)(?:[Мм]атриц|matri)'
      negate: false
      message: { ru: "В ПМИ не найдена матрица трассировки требований.", en: "No requirements traceability matrix was found in the Test Program and Procedure." }

  # ── Поля страницы ЕСПД ──
  - id: gost-19.301-79/page-margins
    title:       { ru: Поля страницы (ЕСПД, рамка/штамп), en: "Page margins (ESPD frame/stamp)" }
    description: { ru: "Геометрия ЕСПД-документа с рамкой и основной надписью (ГОСТ 19.106/2.104): левое 20 мм, правое 10 мм, верхнее 25 мм, нижнее 40 мм.", en: "ESPD document geometry with frame and title block (GOST 19.106/2.104): left 20 mm, right 10 mm, top 25 mm, bottom 40 mm." }
    category:    formatting
    applies_to:  [test_program_and_methodology, shared_test_program_and_methodology]
    default_severity: info
    engine: structural
    params:
      check: page_geometry
      expected: { left_mm: 20, right_mm: 10, top_mm: 25, bottom_mm: 40 }
      tolerance_mm: 2
