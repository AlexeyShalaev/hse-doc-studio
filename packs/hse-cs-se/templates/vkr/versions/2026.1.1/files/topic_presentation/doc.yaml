# Манифест документа (bundle-раскладка v2): всё про документ — в этой папке.
# id = имя папки; языковые редакции — файлы-соседи <stem>.<код>.<ext>,
# файл без кода — единственная форма для всех языков. Пути source_file —
# в проектном пространстве (без суффиксов). Файл doc.yaml в проект не копируется.
#
# «Презентация защиты темы» — деливерабл КТ1 (защита тем ВКР) обоих форматов;
# НЕ презентация защиты работы (та — id: presentation). Один bare-файл с
# inline-ветками по kind (пункты плана §4.1) и lang; ассеты — свои копии.
name:
  ru: Презентация защиты темы
  en: Topic defence presentation
code:
  ru: ПЗТ
  en: TDP
source_file: topic_presentation/topic_presentation.tex
output_file: topic_presentation/topic_presentation.pdf
output_name:
  ru: Презентация защиты темы.pdf
  en: Topic defence presentation.pdf
required: true
supported_langs:
- ru
- en
scope: personal
checks:
  disabled_categories:
  - formatting
  - structure
# Визуальный блок навигации — дивайдер рисуется на смене группы.
group: pres
