# packs/hse-cs-se/templates/vkr/versions/2026.1/checks/gost-19.504-79.yaml
# ГОСТ 19.504-79 — Руководство программиста. Требования к содержанию и оформлению.

# label — короткая подпись группы в UI; ref — полная ссылка на документ.
label:
  ru: ГОСТ 19.504-79
  en: GOST 19.504-79
ref:
  ru: ГОСТ 19.504-79 §2
  en: GOST 19.504-79 §2
source:
  ru: Руководство программиста. Требования к содержанию и оформлению.
  url: https://docs.cntd.ru/document/1200007660

rules:
  # ── Обязательные разделы Руководства программиста ──
  - id: gost-19.504-79/section-purpose
    title:       { ru: Раздел «Назначение и условия применения», en: "Section «Purpose and conditions of use»" }
    description: { ru: "ГОСТ 19.504-79 §2.1: РП должно содержать раздел «Назначение и условия применения» программы с видами деятельности и условиями.", en: "GOST 19.504-79 §2.1: the Programmer's guide must contain a «Purpose and conditions of use» section with the activities and conditions of the program." }
    category:    structure
    applies_to:  [programmer_manual]
    default_severity: err
    engine: regex
    params:
      file_glob: "programmer_manual/*.tex"
      pattern: '(?i)\\section\*?\{[^}]*(?:[Нн]азначени|[Уу]слови|purpose|conditions|use)'
      negate: false
      message: { ru: "В Руководстве программиста отсутствует раздел «Назначение и условия применения».", en: "The Programmer's guide is missing the «Purpose and conditions of use» section." }

  - id: gost-19.504-79/section-characteristics
    title:       { ru: Раздел «Характеристики программы», en: "Section «Program characteristics»" }
    description: { ru: "ГОСТ 19.504-79 §2.2: РП должно содержать раздел «Характеристики программы» с временными характеристиками, режимами работы и пр.", en: "GOST 19.504-79 §2.2: the Programmer's guide must contain a «Program characteristics» section with timing characteristics, operating modes, etc." }
    category:    structure
    applies_to:  [programmer_manual]
    default_severity: err
    engine: regex
    params:
      file_glob: "programmer_manual/*.tex"
      pattern: '(?i)\\section\*?\{[^}]*(?:[Хх]арактеристик|characteristics)'
      negate: false
      message: { ru: "В Руководстве программиста отсутствует раздел «Характеристики программы».", en: "The Programmer's guide is missing the «Program characteristics» section." }

  - id: gost-19.504-79/section-handling
    title:       { ru: Раздел «Обращение к программе», en: "Section «Invoking the program»" }
    description: { ru: "ГОСТ 19.504-79 §2.3: РП должно содержать раздел «Обращение к программе» — способы передачи управления и параметры запуска.", en: "GOST 19.504-79 §2.3: the Programmer's guide must contain an «Invoking the program» section — the methods of passing control and the launch parameters." }
    category:    structure
    applies_to:  [programmer_manual]
    default_severity: err
    engine: regex
    params:
      file_glob: "programmer_manual/*.tex"
      pattern: '(?i)\\section\*?\{[^}]*(?:[Оо]бращени|addressing|invok)'
      negate: false
      message: { ru: "В Руководстве программиста отсутствует раздел «Обращение к программе».", en: "The Programmer's guide is missing the «Invoking the program» section." }

  - id: gost-19.504-79/section-input-output
    title:       { ru: Раздел «Входные и выходные данные», en: "Section «Input and output data»" }
    description: { ru: "ГОСТ 19.504-79 §2.4: РП должно содержать раздел «Входные и выходные данные» с описанием форматов, кодирования и диапазонов значений.", en: "GOST 19.504-79 §2.4: the Programmer's guide must contain an «Input and output data» section describing the formats, encoding and value ranges." }
    category:    structure
    applies_to:  [programmer_manual]
    default_severity: err
    engine: regex
    params:
      file_glob: "programmer_manual/*.tex"
      pattern: '(?i)\\section\*?\{[^}]*(?:[Вв]ходн|[Вв]ыходн|input|output)'
      negate: false
      message: { ru: "В Руководстве программиста отсутствует раздел «Входные и выходные данные».", en: "The Programmer's guide is missing the «Input and output data» section." }

  - id: gost-19.504-79/section-messages
    title:       { ru: Раздел «Сообщения», en: "Section «Messages»" }
    description: { ru: "ГОСТ 19.504-79 §2.5: РП должно содержать раздел «Сообщения» с текстами сообщений и действиями при ошибках.", en: "GOST 19.504-79 §2.5: the Programmer's guide must contain a «Messages» section with message texts and the actions to take on errors." }
    category:    structure
    applies_to:  [programmer_manual]
    default_severity: warn
    engine: regex
    params:
      file_glob: "programmer_manual/*.tex"
      pattern: '(?i)\\section\*?\{[^}]*(?:[Сс]ообщени|messages)'
      negate: false
      message: { ru: "В Руководстве программиста отсутствует раздел «Сообщения».", en: "The Programmer's guide is missing the «Messages» section." }

  # ── Аннотация ──
  - id: gost-19.504-79/annotation
    title:       { ru: Аннотация документа, en: "Document abstract" }
    description: { ru: "ГОСТ 19.105-78 §2.5: каждый программный документ должен иметь аннотацию.", en: "GOST 19.105-78 §2.5: every software document must have an abstract." }
    category:    structure
    applies_to:  [programmer_manual]
    default_severity: warn
    engine: regex
    params:
      file_glob: "programmer_manual/*.tex"
      pattern: '(?i)\\section\*?\{[^}]*(?:[Аа]ннотаци|annotation|abstract)'
      negate: false
      message: { ru: "В Руководстве программиста отсутствует раздел «Аннотация».", en: "The Programmer's guide is missing the «Abstract» section." }

  # ── Поля страницы ЕСПД ──
  - id: gost-19.504-79/page-margins
    title:       { ru: Поля страницы (ЕСПД, рамка/штамп), en: "Page margins (ESPD frame/stamp)" }
    description: { ru: "Геометрия ЕСПД-документа с рамкой и основной надписью (ГОСТ 19.106/2.104): левое 20 мм, правое 10 мм, верхнее 25 мм, нижнее 40 мм.", en: "ESPD document geometry with frame and title block (GOST 19.106/2.104): left 20 mm, right 10 mm, top 25 mm, bottom 40 mm." }
    category:    formatting
    applies_to:  [programmer_manual]
    default_severity: info
    engine: structural
    params:
      check: page_geometry
      expected: { left_mm: 20, right_mm: 10, top_mm: 25, bottom_mm: 40 }
      tolerance_mm: 2
