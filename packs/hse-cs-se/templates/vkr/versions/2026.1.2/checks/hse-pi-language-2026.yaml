# packs/hse-cs-se/templates/vkr/versions/2026.1/checks/hse-pi-language-2026.yaml
# Лингвистические проверки через LanguageTool (engine: external).
#
# Это правило-«шлюз»: его наличие включает прогон LanguageTool для документа.
# Прогон выполняется только если LanguageTool включён в Настройки → Проверки и
# сервер доступен (по умолчанию http://localhost:8010 — управляемый контейнер).
# Конкретные находки приходят с rule_id вида `lt:<ПРАВИЛО_LT>` и наследуют
# severity этого правила. Управление — как у любого ГОСТ-правила: правило можно
# отключить целиком для документа/проекта (таб «Проверки» / настройки проекта),
# а отдельную находку — погасить кнопкой «Игнорировать».

# label — короткая подпись группы в UI; ref — полная ссылка на документ.
label:
  ru: Язык и типографика
  en: Language & typography
ref:
  ru: LanguageTool — грамматика, орфография, типографика и стиль (RU/EN)
  en: LanguageTool — grammar, spelling, typography and style (RU/EN)
source:
  url: https://languagetool.org/

rules:
  - id: hse-pi-lang/languagetool
    title:       { ru: "LanguageTool: грамматика и стиль", en: "LanguageTool: grammar & style" }
    description: { ru: "Лингвистическая проверка текста документа через сервер LanguageTool: орфография, грамматика, пунктуация, типографика и стиль. Включается в Настройки → Проверки. Находки можно гасить по отдельности или отключать проверку целиком для документа/проекта.", en: "Linguistic check of the document text via the LanguageTool server: spelling, grammar, punctuation, typography and style. Enabled in Settings → Checks. Findings can be dismissed individually, or the check can be disabled entirely for the document/project." }
    category:    language
    applies_to:  [thesis, technical_specification, shared_technical_specification, annotation, shared_annotation, test_program_and_methodology, shared_test_program_and_methodology, source_listing, programmer_manual, operator_manual]
    default_severity: warn
    engine:      external
    params:
      # LanguageTool сам определяет язык ('auto'); можно зафиксировать ru-RU/en-US.
      # Одно правило обслуживает и русские, и английские проекты, поэтому язык
      # здесь только 'auto' — фиксация сломала бы половину комплектов.
      language: auto
      # Британский вариант английского. Автоопределение варианта не делает и
      # берёт en-US, а комплект на английском писан по-британски и следует
      # официальным формулировкам НИУ ВШЭ («educational programme»,
      # «Organisation») — в en-US каждая такая форма приходила опечаткой.
      # На русский текст параметр не влияет: у ru-RU вариантов нет.
      preferred_variants: en-GB
      # Отключённые правила LT:
      #  - WHITESPACE_RULE            — отступы/выравнивание в LaTeX-исходнике;
      #  - DoubleNOT                  — «не менее X … не менее Y» — штатная формулировка ГОСТ;
      #  - PREP_C_and_Noun            — «в соответствии с ГОСТ 19.x» — несклоняемая аббревиатура;
      #  - UPPERCASE_SENTENCE_START   — пункты списков (\item) — фрагменты предложений;
      #  - OXFORD_SPELLING_Z_NOT_S    — оксфордское «-ize» вместо «-ise»: у en-GB это
      #                                 домашний стиль издательства, а не ошибка; комплект
      #                                 держится обычной британской нормы («organisation»).
      disabled_rules: WHITESPACE_RULE,DoubleNOT,PREP_C_and_Noun,UPPERCASE_SENTENCE_START,OXFORD_SPELLING_Z_NOT_S
      # Слова, которых нет в словаре LT, но которые корректны в ИТ-документации
      # ОП ПИ. Запись с «*» — префикс (покрывает словоформы). Находка гасится,
      # если помеченный фрагмент совпадает с записью (без учёта регистра).
      # Список общий для обоих языков: список помеченных фрагментов, а не словарь.
      ignore_words:
        # Сокращение из строки состава отчёта по ГОСТ 7.32 («…~источн.»).
        - источн
        # ── термины и обозначения комплекта (латиница) ──
        - GOST          # ГОСТ в английской редакции документов
        - ESPD          # ЕСПД — Единая система программной документации
        - SoW           # Statement of Work — англоязычное имя ТЗ
        - ТЗ-Ф-*        # идентификаторы требований: единые для ru/en ради трассировки
        - OpenAPI
        - lstlisting    # имена LaTeX-окружений и пакетов в \texttt{}
        - tikz
        - params        # имена полей JSON-ответа в примерах API
        - json
        # ── русскоязычные термины ──
        # «Нормоконтроль» — центральный термин этой предметной области (проверка
        # оформления перед защитой), но его нет ни в одном словаре LT: без записи
        # каждая работа о подготовке документов тонет в мнимых опечатках.
        - нормоконтрол*
        - самописн*
        - трассируемост*
        - онлайн-редактор*
        - соруководител*
        - версионирован*
        - версионн*
        - межсервисн*
        - персистентн*
        - логирова*
        - депло*
        - коммит*
        - неконсистентн*
        - линтинг*
        - линтер*
        - блокер*
        - перцентил*
        - верхнеуровнев*
        - переиспользован*
        - краткоживущ*
        - бизнес-инвариант*
        - бизнес-правил*
        - монорепозитор*
        - форматтер*
        - плейсхолдер*
        - рантайм*
        - блока-образца
        - Стандартинформ
        - ГОСТов
        - ГОСТами
        - ГОСТах
        # «Документ(-ы), на основании которого(-ых)…» — формулировки из формы ГОСТ 19.201.
        - "-ы"
        - "-ых"
        - "-ей"
        - "-файлы"
