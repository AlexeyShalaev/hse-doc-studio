# packs/hse-cs-se/templates/vkr/versions/2026.1/checks/gost-19.505-79.yaml
# ГОСТ 19.505-79 — Руководство оператора. Требования к содержанию и оформлению.

# label — короткая подпись группы в UI; ref — полная ссылка на документ.
label:
  ru: ГОСТ 19.505-79
  en: GOST 19.505-79
ref:
  ru: ГОСТ 19.505-79 §2
  en: GOST 19.505-79 §2
source:
  ru: Руководство оператора. Требования к содержанию и оформлению.
  url: https://docs.cntd.ru/document/1200007661

rules:
  # ── Обязательные разделы Руководства оператора ──
  - id: gost-19.505-79/section-purpose
    title:       { ru: Раздел «Назначение программы», en: "Section «Purpose of the program»" }
    description: { ru: "ГОСТ 19.505-79 §2.1: РО должно содержать раздел «Назначение программы» с описанием задач, решаемых программой.", en: "GOST 19.505-79 §2.1: the Operator's guide must contain a «Purpose of the program» section describing the tasks the program solves." }
    category:    structure
    applies_to:  [operator_manual]
    default_severity: err
    engine: regex
    params:
      file_glob: "operator_manual/*.tex"
      pattern: '(?i)\\section\*?\{[^}]*(?:[Нн]азначени|purpose)'
      negate: false
      message: { ru: "В Руководстве оператора отсутствует раздел «Назначение программы».", en: "The Operator's guide is missing the «Purpose of the program» section." }

  - id: gost-19.505-79/section-conditions
    title:       { ru: Раздел «Условия выполнения программы», en: "Section «Conditions for running the program»" }
    description: { ru: "ГОСТ 19.505-79 §2.2: РО должно содержать раздел «Условия выполнения программы» с минимальными и максимальными конфигурациями.", en: "GOST 19.505-79 §2.2: the Operator's guide must contain a «Conditions for running the program» section with the minimum and maximum configurations." }
    category:    structure
    applies_to:  [operator_manual]
    default_severity: err
    engine: regex
    params:
      file_glob: "operator_manual/*.tex"
      pattern: '(?i)\\section\*?\{[^}]*(?:[Уу]слови|conditions)'
      negate: false
      message: { ru: "В Руководстве оператора отсутствует раздел «Условия выполнения программы».", en: "The Operator's guide is missing the «Conditions for running the program» section." }

  - id: gost-19.505-79/section-execution
    title:       { ru: Раздел «Выполнение программы», en: "Section «Running the program»" }
    description: { ru: "ГОСТ 19.505-79 §2.3: РО должно содержать раздел «Выполнение программы» с описанием загрузки, операций и порядка работы.", en: "GOST 19.505-79 §2.3: the Operator's guide must contain a «Running the program» section describing the loading, the operations and the order of work." }
    category:    structure
    applies_to:  [operator_manual]
    default_severity: err
    engine: regex
    params:
      file_glob: "operator_manual/*.tex"
      pattern: '(?i)\\section\*?\{[^}]*(?:[Вв]ыполнени|execution)'
      negate: false
      message: { ru: "В Руководстве оператора отсутствует раздел «Выполнение программы».", en: "The Operator's guide is missing the «Running the program» section." }

  - id: gost-19.505-79/section-diagnostics
    title:       { ru: Раздел «Сообщения оператору», en: "Section «Messages to the operator»" }
    description: { ru: "ГОСТ 19.505-79 §2.4: РО должно содержать раздел «Сообщения оператору» с перечнем сообщений об ошибках и действиями оператора.", en: "GOST 19.505-79 §2.4: the Operator's guide must contain a «Messages to the operator» section with a list of error messages and the operator's actions." }
    category:    structure
    applies_to:  [operator_manual]
    default_severity: warn
    engine: regex
    params:
      file_glob: "operator_manual/*.tex"
      pattern: '(?i)\\section\*?\{[^}]*(?:[Сс]ообщени|messages)'
      negate: false
      message: { ru: "В Руководстве оператора отсутствует раздел «Сообщения оператору».", en: "The Operator's guide is missing the «Messages to the operator» section." }

  # ── Аннотация ──
  - id: gost-19.505-79/annotation
    title:       { ru: Аннотация документа, en: "Document abstract" }
    description: { ru: "ГОСТ 19.105-78 §2.5: каждый программный документ должен иметь аннотацию.", en: "GOST 19.105-78 §2.5: every software document must have an abstract." }
    category:    structure
    applies_to:  [operator_manual]
    default_severity: warn
    engine: regex
    params:
      file_glob: "operator_manual/*.tex"
      pattern: '(?i)\\section\*?\{[^}]*(?:[Аа]ннотаци|annotation|abstract)'
      negate: false
      message: { ru: "В Руководстве оператора отсутствует раздел «Аннотация».", en: "The Operator's guide is missing the «Abstract» section." }

  # ── Поля страницы ЕСПД ──
  - id: gost-19.505-79/page-margins
    title:       { ru: Поля страницы (ЕСПД, рамка/штамп), en: "Page margins (ESPD frame/stamp)" }
    description: { ru: "Геометрия ЕСПД-документа с рамкой и основной надписью (ГОСТ 19.106/2.104): левое 20 мм, правое 10 мм, верхнее 25 мм, нижнее 40 мм.", en: "ESPD document geometry with frame and title block (GOST 19.106/2.104): left 20 mm, right 10 mm, top 25 mm, bottom 40 mm." }
    category:    formatting
    applies_to:  [operator_manual]
    default_severity: info
    engine: structural
    params:
      check: page_geometry
      expected: { left_mm: 20, right_mm: 10, top_mm: 25, bottom_mm: 40 }
      tolerance_mm: 2

  # ── Скриншоты интерфейса ──
  - id: gost-19.505-79/interface-screenshots
    title:       { ru: Иллюстрации интерфейса, en: "Interface illustrations" }
    description: { ru: "Рекомендуется включить скриншоты или схемы пользовательского интерфейса для наглядности.", en: "It is recommended to include screenshots or diagrams of the user interface for clarity." }
    category:    structure
    applies_to:  [operator_manual]
    default_severity: info
    engine: regex
    params:
      file_glob: "operator_manual/*.tex"
      pattern: '(?i)\\includegraphics'
      negate: false
      message: { ru: "В Руководстве оператора рекомендуется добавить скриншоты интерфейса.", en: "It is recommended to add interface screenshots to the Operator's guide." }
