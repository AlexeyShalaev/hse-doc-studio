{{- if and .Values.runner.enabled (eq .Values.runner.executor "docker") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hds.fullname" . }}-runner
  labels:
    {{- include "hds.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner
spec:
  replicas: {{ .Values.runner.replicas }}
  selector:
    matchLabels:
      {{- include "hds.selector" . | nindent 6 }}
      app.kubernetes.io/component: runner
  template:
    metadata:
      labels:
        {{- include "hds.selector" . | nindent 8 }}
        app.kubernetes.io/component: runner
    spec:
      # Этот раннер работает через docker.sock, а не Kubernetes API: токен ServiceAccount ему не нужен.
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.podSecurityContext.runAsUser }}
        runAsGroup: {{ .Values.podSecurityContext.runAsGroup }}
        supplementalGroups: [{{ .Values.runner.dockerGid }}]
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # hostPath создаётся от root, fsGroup на него не действует: отдаём каталог пользователю раннера.
        - name: fix-data-dir
          image: {{ include "hds.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["chown", "-R", "{{ .Values.podSecurityContext.runAsUser }}:{{ .Values.podSecurityContext.runAsGroup }}", {{ .Values.runner.dataDir | quote }}]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL], add: [CHOWN, DAC_OVERRIDE]}
          volumeMounts:
            - {name: runner-data, mountPath: {{ .Values.runner.dataDir | quote }}}
      containers:
        - name: runner
          image: {{ include "hds.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["hse-doc-studio", "runner"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          env:
            - {name: HSE_RUNNER__API_URL, value: "http://{{ include "hds.fullname" . }}:{{ .Values.service.port }}"}
            - {name: HSE_RUNNER__DATA_DIR, value: {{ .Values.runner.dataDir | quote }}}
            - {name: HSE_RUNNER__CONCURRENCY, value: {{ .Values.runner.concurrency | quote }}}
            {{- if .Values.runner.tags }}
            - {name: HSE_RUNNER__TAGS, value: {{ .Values.runner.tags | quote }}}
            {{- end }}
            {{- with include "hds.runnerOfficeUrl" . }}
            # Gotenberg для офисных задач (тег office): runner.officeUrl или встроенный services.officeConvert.
            - {name: HSE_RUNNER__OFFICE_URL, value: {{ . | quote }}}
            {{- end }}
            # Нужен один раз: выданный раннеру токен сохраняется в его каталоге данных.
            - {name: HSE_RUNNER__TOKEN, valueFrom: {secretKeyRef: {name: {{ include "hds.secretName" . }}, key: runner-bootstrap-token}}}
            # Свой под из downward API: раннер сообщает в админку, как он развёрнут (на работу не влияет).
            - {name: HSE_RUNNER__POD__NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
            - {name: HSE_RUNNER__POD__NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: HSE_RUNNER__POD__SERVICE_ACCOUNT, valueFrom: {fieldRef: {fieldPath: spec.serviceAccountName}}}
            - {name: HSE_RUNNER__POD__CPU_REQUEST_M, valueFrom: {resourceFieldRef: {containerName: runner, resource: requests.cpu, divisor: 1m}}}
            - {name: HSE_RUNNER__POD__CPU_LIMIT_M, valueFrom: {resourceFieldRef: {containerName: runner, resource: limits.cpu, divisor: 1m}}}
            - {name: HSE_RUNNER__POD__MEMORY_REQUEST_MI, valueFrom: {resourceFieldRef: {containerName: runner, resource: requests.memory, divisor: 1Mi}}}
            - {name: HSE_RUNNER__POD__MEMORY_LIMIT_MI, valueFrom: {resourceFieldRef: {containerName: runner, resource: limits.memory, divisor: 1Mi}}}
            - {name: HSE_RUNNER__POD__EPHEMERAL_REQUEST_MI, valueFrom: {resourceFieldRef: {containerName: runner, resource: requests.ephemeral-storage, divisor: 1Mi}}}
            - {name: HSE_RUNNER__POD__EPHEMERAL_LIMIT_MI, valueFrom: {resourceFieldRef: {containerName: runner, resource: limits.ephemeral-storage, divisor: 1Mi}}}
          volumeMounts:
            - {name: runner-data, mountPath: {{ .Values.runner.dataDir | quote }}}
            - {name: docker-sock, mountPath: /var/run/docker.sock}
          resources:
            {{- toYaml .Values.runner.resources | nindent 12 }}
      volumes:
        - name: runner-data
          hostPath: {path: {{ .Values.runner.dataDir | quote }}, type: DirectoryOrCreate}
        - name: docker-sock
          hostPath: {path: {{ .Values.runner.dockerSocket | quote }}, type: Socket}
      {{- with .Values.runner.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.runner.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.runner.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
