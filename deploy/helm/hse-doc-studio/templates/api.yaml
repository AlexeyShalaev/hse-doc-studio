apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hds.fullname" . }}-api
  labels:
    {{- include "hds.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  # Одна реплика и Recreate: том проектов пишется одним процессом, две копии не должны жить одновременно.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "hds.selector" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "hds.selector" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- if .Values.runner.installFromUi.enabled }}
      serviceAccountName: {{ include "hds.fullname" . }}-api
      {{- else }}
      # Студия не ходит в Kubernetes API: токен ServiceAccount в поде не нужен.
      automountServiceAccountToken: false
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.podSecurityContext.runAsUser }}
        runAsGroup: {{ .Values.podSecurityContext.runAsGroup }}
        seccompProfile: {type: RuntimeDefault}
        fsGroup: {{ .Values.podSecurityContext.fsGroup }}
      containers:
        - name: api
          image: {{ include "hds.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - {name: http, containerPort: 8000}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          env:
            {{- include "hds.env" . | nindent 12 }}
            {{- if .Values.backups.enabled }}
            {{- include "hds.backupsEnv" . | nindent 12 }}
            {{- end }}
            {{- if .Values.runner.installFromUi.enabled }}
            # Установка раннеров из админки в этот кластер: права и ServiceAccount раннеров в runner-install-ui.yaml.
            - {name: HSE_STUDIO__RUNNER_INSTALL__KUBERNETES_ENABLED, value: "true"}
            - {name: HSE_STUDIO__RUNNER_INSTALL__KUBERNETES_SERVICE_ACCOUNT, value: {{ include "hds.fullname" . }}-runner-ui}
            - {name: HSE_STUDIO__RUNNER_INSTALL__KUBERNETES_STUDIO_URL, value: "http://{{ include "hds.fullname" . }}:{{ .Values.service.port }}"}
            {{- $ui := .Values.runner.installFromUi }}
            - {name: HSE_STUDIO__RUNNER_INSTALL__KUBERNETES_RUNNER_CPU_REQUEST, value: {{ $ui.resources.requests.cpu | quote }}}
            - {name: HSE_STUDIO__RUNNER_INSTALL__KUBERNETES_RUNNER_CPU_LIMIT, value: {{ $ui.resources.limits.cpu | quote }}}
            - {name: HSE_STUDIO__RUNNER_INSTALL__KUBERNETES_RUNNER_MEMORY_REQUEST, value: {{ $ui.resources.requests.memory | quote }}}
            - {name: HSE_STUDIO__RUNNER_INSTALL__KUBERNETES_RUNNER_MEMORY_LIMIT, value: {{ $ui.resources.limits.memory | quote }}}
            - {name: HSE_STUDIO__RUNNER_INSTALL__KUBERNETES_BUILD_CPU_REQUEST, value: {{ $ui.buildResources.requests.cpu | quote }}}
            - {name: HSE_STUDIO__RUNNER_INSTALL__KUBERNETES_BUILD_CPU_LIMIT, value: {{ $ui.buildResources.limits.cpu | quote }}}
            - {name: HSE_STUDIO__RUNNER_INSTALL__KUBERNETES_BUILD_MEMORY_REQUEST, value: {{ $ui.buildResources.requests.memory | quote }}}
            - {name: HSE_STUDIO__RUNNER_INSTALL__KUBERNETES_BUILD_MEMORY_LIMIT, value: {{ $ui.buildResources.limits.memory | quote }}}
            - {name: HSE_STUDIO__RUNNER_INSTALL__KUBERNETES_RESOURCE_MAX_CPU, value: {{ $ui.maxCpu | quote }}}
            - {name: HSE_STUDIO__RUNNER_INSTALL__KUBERNETES_RESOURCE_MAX_MEMORY, value: {{ $ui.maxMemory | quote }}}
            - {name: HSE_STUDIO__RUNNER_INSTALL__KUBERNETES_STORAGE_SIZE, value: {{ .Values.runner.installFromUi.storageSize | quote }}}
            - {name: HSE_STUDIO__RUNNER_INSTALL__KUBERNETES_STORAGE_CLASS, value: {{ .Values.runner.installFromUi.storageClassName | quote }}}
            {{- end }}
            {{- if .Values.updater.enabled }}
            # Обновление из админки: версию ставит сервис updater (updater-kubernetes.yaml), api только решает и учитывает.
            - {name: HSE_STUDIO__SERVER_UPDATE__EXECUTOR, value: kubernetes}
            - {name: HSE_STUDIO__SERVER_UPDATE__UPDATER_TOKEN, valueFrom: {secretKeyRef: {name: {{ include "hds.secretName" . }}, key: updater-token}}}
            {{- end }}
            # Первая установка: схему ведёт сам api под advisory-локом. Дальше её обновляет Job pre-upgrade.
            - {name: HSE_STUDIO__DB__AUTO_MIGRATE, value: {{ or .Release.IsInstall (not .Values.migrations.enabled) | quote }}}
          volumeMounts:
            - {name: data, mountPath: /data}
            {{- if and .Values.backups.enabled .Values.backups.local.enabled }}
            - {name: backups, mountPath: /backups}
            {{- end }}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "hds.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if and .Values.backups.enabled .Values.backups.local.enabled }}
        - name: backups
          persistentVolumeClaim:
            claimName: {{ include "hds.backupsPvcName" . }}
        {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hds.fullname" . }}
  labels:
    {{- include "hds.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "hds.selector" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http}
