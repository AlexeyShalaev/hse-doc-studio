apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hds.fullname" . }}-api
  labels:
    {{- include "hds.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  # Одна реплика и Recreate: том проектов пишется одним процессом, две копии не должны жить одновременно.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "hds.selector" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "hds.selector" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.podSecurityContext.runAsUser }}
        runAsGroup: {{ .Values.podSecurityContext.runAsGroup }}
        fsGroup: {{ .Values.podSecurityContext.fsGroup }}
      containers:
        - name: api
          image: {{ include "hds.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - {name: http, containerPort: 8000}
          env:
            {{- include "hds.env" . | nindent 12 }}
            # Первая установка: схему ведёт сам api под advisory-локом. Дальше её обновляет Job pre-upgrade.
            - {name: HSE_STUDIO__DB__AUTO_MIGRATE, value: {{ or .Release.IsInstall (not .Values.migrations.enabled) | quote }}}
          volumeMounts:
            - {name: data, mountPath: /data}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "hds.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hds.fullname" . }}
  labels:
    {{- include "hds.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "hds.selector" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http}
