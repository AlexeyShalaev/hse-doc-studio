{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hds.secretName" . }}
  labels:
    {{- include "hds.labels" . | nindent 4 }}
type: Opaque
stringData:
  dsn: {{ required "database.dsn или secrets.existingSecret обязателен" .Values.database.dsn | quote }}
  secrets-key: {{ required "secrets.secretsKey или secrets.existingSecret обязателен" .Values.secrets.secretsKey | quote }}
  s3-access-key: {{ .Values.s3.accessKey | quote }}
  s3-secret-key: {{ .Values.s3.secretKey | quote }}
  runner-bootstrap-token: {{ .Values.secrets.runnerBootstrapToken | quote }}
  smtp-password: {{ .Values.mail.password | quote }}
  health-token: {{ .Values.secrets.healthToken | quote }}
  metrics-token: {{ .Values.secrets.metricsToken | quote }}
{{- end }}
