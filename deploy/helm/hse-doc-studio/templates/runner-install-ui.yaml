{{- if .Values.runner.installFromUi.enabled }}
{{- $ui := .Values.runner.installFromUi }}
{{- $full := include "hds.fullname" . }}
{{- $runnerSa := printf "%s-runner-ui" $full }}
{{- $apiSa := printf "%s-api" $full }}
# Установка раннеров из админки Студии в этот кластер (docs/design/runner-install.md, раздел 4.3). Студия создаёт
# Deployment, Secret с токеном и том данных, а ServiceAccount и права подов сборки для таких раннеров готовит этот
# чарт заранее: Студия не получает права на Role и RoleBinding, поэтому выдать себе или раннеру лишнее не может.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $runnerSa }}
  labels:
    {{- include "hds.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner-ui
---
# ServiceAccount раннеров, поставленных из админки: только поды сборки в namespace релиза.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $runnerSa }}-builds
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hds.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner-ui
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, list, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $runnerSa }}-builds
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hds.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner-ui
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $runnerSa }}-builds
subjects:
  - kind: ServiceAccount
    name: {{ $runnerSa }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $apiSa }}
  labels:
    {{- include "hds.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
---
# Права самой Студии: создать и убрать Deployment, Secret с токеном и том данных раннера. Secret без get и list,
# Role и RoleBinding без доступа, ClusterRole нет.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $apiSa }}-runner-install
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hds.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [create, get, list, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, delete]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $apiSa }}-runner-install
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hds.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $apiSa }}-runner-install
subjects:
  - kind: ServiceAccount
    name: {{ $apiSa }}
    namespace: {{ .Release.Namespace }}
{{- end }}
