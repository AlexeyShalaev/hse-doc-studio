# Значения для helm lint и golden-теста: фиксированные, без секретов.
publicUrl: https://studio.example.org
trustedProxies: ["10.0.0.0/8"]
database:
  dsn: postgresql://studio:pw@db.example.org:5432/studio
s3:
  endpoint: https://s3.example.org
  bucket: studio
  accessKey: AKIATEST
  secretKey: s3-test-secret
secrets:
  secretsKey: test-fernet-key
  runnerBootstrapToken: test-runner-token
ingress:
  enabled: true
  className: nginx
  host: studio.example.org
  tls:
    enabled: true
    secretName: studio-tls
services:
  languagetoolReplicas: ["http://languagetool-0.lt:8010", "http://languagetool-1.lt:8010"]
  officeEditorReplicas: ["http://onlyoffice.example.org"]
runner:
  enabled: true
  tags: tex
backups:
  enabled: true
  local:
    enabled: true
    persistence:
      size: 100Gi
      storageClassName: slow
  destination:
    kind: s3
    name: offsite
    endpoint: https://backup.example.org
    bucket: studio-backups
    prefix: studio
    accessKey: AKIABACKUP
    secretKey: backup-test-secret
  schedule:
    kind: cron
    cron: "30 2 * * *"
    keepLast: 14
    keepDays: 60
