# Source: hse-doc-studio/templates/updater-kubernetes.yaml
# Строго свой namespace: один Deployment по имени (get, patch), Job обновления, чтение подов и их логов для диагностики.
# Ни secrets, ни configmaps, ни create/delete у Deployment, ни ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rel-hse-doc-studio-updater
  namespace: studio
  labels:
    app.kubernetes.io/name: hse-doc-studio
    app.kubernetes.io/instance: rel
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hse-doc-studio-0.1.0
    app.kubernetes.io/component: updater
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [rel-hse-doc-studio-api]
    verbs: [get, patch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]

