# Source: hse-doc-studio/templates/updater-kubernetes.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rel-hse-doc-studio-updater
  labels:
    app.kubernetes.io/name: hse-doc-studio
    app.kubernetes.io/instance: rel
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hse-doc-studio-0.1.0
    app.kubernetes.io/component: updater
spec:
  # Одна копия: две параллельно вели бы один запуск дважды.
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: hse-doc-studio
      app.kubernetes.io/instance: rel
      app.kubernetes.io/component: updater
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hse-doc-studio
        app.kubernetes.io/instance: rel
        app.kubernetes.io/component: updater
      annotations:
        checksum/secret: e5538a18ebb8f0da6003827e5a5ba9bb366bf4b8fe029b41a3d897c99f9701c0
    spec:
      serviceAccountName: rel-hse-doc-studio-updater
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: updater
          image: ghcr.io/alexeyshalaev/hse-doc-studio:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "hse_doc_studio.infra.update.server_updater"]
          env:
            - {name: HSE_UPDATER__EXECUTOR, value: kubernetes}
            - {name: HSE_UPDATER__API_URL, value: "http://rel-hse-doc-studio:8000"}
            - {name: HSE_UPDATER__TOKEN, valueFrom: {secretKeyRef: {name: rel-hse-doc-studio-secrets, key: updater-token}}}
            - {name: HSE_UPDATER__HEALTH_TOKEN, valueFrom: {secretKeyRef: {name: rel-hse-doc-studio-secrets, key: health-token, optional: true}}}
            - {name: HSE_UPDATER__DATA_DIR, value: /var/lib/hse-updater}
            - {name: HSE_UPDATER__HEALTH_TIMEOUT_S, value: "300"}
            - {name: HSE_UPDATER__KUBE__DEPLOYMENT, value: "rel-hse-doc-studio-api"}
            - {name: HSE_UPDATER__KUBE__CONTAINER, value: api}
            - {name: HSE_UPDATER__KUBE__NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
            - {name: HSE_UPDATER__KUBE__STOP_TIMEOUT_S, value: "180"}
            - {name: HSE_UPDATER__KUBE__MIGRATE_TIMEOUT_S, value: "3600"}
            - {name: HSE_UPDATER__KUBE__POD_START_TIMEOUT_S, value: "120"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/hse-updater}
            - {name: tmp, mountPath: /tmp}
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
      volumes:
        # Очередь событий для api (он гаснет на время обновления). Состояние запуска дублируется в аннотациях Deployment api,
        # поэтому потеря тома при пересоздании пода не страшна.
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}

