apiVersion: apps/v1
kind: Deployment
metadata:
  name: rel-hse-doc-studio-api
  labels:
    app.kubernetes.io/name: hse-doc-studio
    app.kubernetes.io/instance: rel
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hse-doc-studio-0.1.0
    app.kubernetes.io/component: api
spec:
  # Одна реплика и Recreate: том проектов пишется одним процессом, две копии не должны жить одновременно.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hse-doc-studio
      app.kubernetes.io/instance: rel
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hse-doc-studio
        app.kubernetes.io/instance: rel
        app.kubernetes.io/component: api
      annotations:
        checksum/secret: e5538a18ebb8f0da6003827e5a5ba9bb366bf4b8fe029b41a3d897c99f9701c0
    spec:
      # Студия не ходит в Kubernetes API: токен ServiceAccount в поде не нужен.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
        fsGroup: 10001
      containers:
        - name: api
          image: ghcr.io/alexeyshalaev/hse-doc-studio:latest
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          env:
            - {name: HSE_STUDIO__MODE, value: server}
            - {name: HSE_STUDIO__SERVER__HOST, value: "0.0.0.0"}
            - {name: HSE_STUDIO__SERVER__PORT, value: "8000"}
            - {name: HSE_STUDIO__DATA_DIR, value: /data}
            - {name: HSE_STUDIO__LOGGING__USE_JSON, value: "true"}
            - {name: HSE_STUDIO__AUTH__PUBLIC_URL, value: "https://studio.example.org"}
            - {name: HSE_STUDIO__AUTH__TRUSTED_PROXIES, value: "[\"10.0.0.0/8\"]"}
            - {name: HSE_STUDIO__S3__ENDPOINT, value: "https://s3.example.org"}
            - {name: HSE_STUDIO__S3__BUCKET, value: "studio"}
            - {name: HSE_STUDIO__S3__REGION, value: ""}
            - {name: HSE_STUDIO__MAIL__HOST, value: ""}
            - {name: HSE_STUDIO__MAIL__PORT, value: "587"}
            - {name: HSE_STUDIO__MAIL__USERNAME, value: ""}
            - {name: HSE_STUDIO__MAIL__FROM_ADDRESS, value: "no-reply@localhost"}
            - {name: HSE_STUDIO__LANGUAGETOOL__POOL_REPLICAS, value: "[\"http://languagetool-0.lt:8010\",\"http://languagetool-1.lt:8010\"]"}
            - {name: HSE_STUDIO__MODEL_SERVERS__LOCAL_ENABLED, value: "false"}
            - {name: HSE_STUDIO__OFFICE_EDITOR__POOL_REPLICAS, value: "[\"http://onlyoffice.example.org\"]"}
            - {name: HSE_STUDIO__OFFICE_EDITOR__BACKEND_INTERNAL_URL, value: "http://rel-hse-doc-studio:8000"}
            - {name: HSE_STUDIO__DB__DSN, valueFrom: {secretKeyRef: {name: rel-hse-doc-studio-secrets, key: dsn}}}
            - {name: HSE_STUDIO__SECRETS__KEY, valueFrom: {secretKeyRef: {name: rel-hse-doc-studio-secrets, key: secrets-key}}}
            - {name: HSE_STUDIO__S3__ACCESS_KEY, valueFrom: {secretKeyRef: {name: rel-hse-doc-studio-secrets, key: s3-access-key}}}
            - {name: HSE_STUDIO__S3__SECRET_KEY, valueFrom: {secretKeyRef: {name: rel-hse-doc-studio-secrets, key: s3-secret-key}}}
            - {name: HSE_STUDIO__JOBS__RUNNER_BOOTSTRAP_TOKEN, valueFrom: {secretKeyRef: {name: rel-hse-doc-studio-secrets, key: runner-bootstrap-token, optional: true}}}
            - {name: HSE_STUDIO__MAIL__PASSWORD, valueFrom: {secretKeyRef: {name: rel-hse-doc-studio-secrets, key: smtp-password, optional: true}}}
            - {name: HSE_STUDIO__OBSERVABILITY__HEALTH_TOKEN, valueFrom: {secretKeyRef: {name: rel-hse-doc-studio-secrets, key: health-token, optional: true}}}
            - {name: HSE_STUDIO__OBSERVABILITY__METRICS_TOKEN, valueFrom: {secretKeyRef: {name: rel-hse-doc-studio-secrets, key: metrics-token, optional: true}}}
            - {name: HSE_STUDIO__OFFICE_EDITOR__JWT_SECRET, valueFrom: {secretKeyRef: {name: rel-hse-doc-studio-secrets, key: office-jwt-secret, optional: true}}}
            
            - {name: HSE_STUDIO__BACKUPS__LOCAL_ROOT, value: /backups}
            - {name: HSE_STUDIO__BACKUPS__PROVISION__DESTINATION_KIND, value: "s3"}
            - {name: HSE_STUDIO__BACKUPS__PROVISION__NAME, value: "offsite"}
            - {name: HSE_STUDIO__BACKUPS__PROVISION__LOCAL_PATH, value: "main"}
            - {name: HSE_STUDIO__BACKUPS__PROVISION__ENDPOINT, value: "https://backup.example.org"}
            - {name: HSE_STUDIO__BACKUPS__PROVISION__REGION, value: "us-east-1"}
            - {name: HSE_STUDIO__BACKUPS__PROVISION__BUCKET, value: "studio-backups"}
            - {name: HSE_STUDIO__BACKUPS__PROVISION__PREFIX, value: "studio"}
            - {name: HSE_STUDIO__BACKUPS__PROVISION__PATH_STYLE, value: "true"}
            - {name: HSE_STUDIO__BACKUPS__PROVISION__ACCESS_KEY, valueFrom: {secretKeyRef: {name: rel-hse-doc-studio-secrets, key: backup-access-key, optional: true}}}
            - {name: HSE_STUDIO__BACKUPS__PROVISION__SECRET_KEY, valueFrom: {secretKeyRef: {name: rel-hse-doc-studio-secrets, key: backup-secret-key, optional: true}}}
            - {name: HSE_STUDIO__BACKUPS__PROVISION__SCHEDULE_ENABLED, value: "true"}
            - {name: HSE_STUDIO__BACKUPS__PROVISION__SCHEDULE_KIND, value: "cron"}
            - {name: HSE_STUDIO__BACKUPS__PROVISION__INTERVAL_HOURS, value: "24"}
            - {name: HSE_STUDIO__BACKUPS__PROVISION__CRON, value: "30 2 * * *"}
            - {name: HSE_STUDIO__BACKUPS__PROVISION__KEEP_LAST, value: "14"}
            - {name: HSE_STUDIO__BACKUPS__PROVISION__KEEP_DAYS, value: "60"}
            - {name: HSE_STUDIO__BACKUPS__PROVISION__ENCRYPTION_MODE, value: "installation"}
            - {name: HSE_STUDIO__BACKUPS__PROVISION__NOTIFY_ADMINS, value: "true"}
            # Обновление из админки: версию ставит сервис updater (updater-kubernetes.yaml), api только решает и учитывает.
            - {name: HSE_STUDIO__SERVER_UPDATE__EXECUTOR, value: kubernetes}
            - {name: HSE_STUDIO__SERVER_UPDATE__UPDATER_TOKEN, valueFrom: {secretKeyRef: {name: rel-hse-doc-studio-secrets, key: updater-token}}}
            # Первая установка: схему ведёт сам api под advisory-локом. Дальше её обновляет Job pre-upgrade.
            - {name: HSE_STUDIO__DB__AUTO_MIGRATE, value: "true"}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: backups, mountPath: /backups}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
            failureThreshold: 6
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rel-hse-doc-studio-data
        - name: backups
          persistentVolumeClaim:
            claimName: rel-hse-doc-studio-backups

