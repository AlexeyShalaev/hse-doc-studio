# Source: hse-doc-studio/templates/runner.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rel-hse-doc-studio-runner
  labels:
    app.kubernetes.io/name: hse-doc-studio
    app.kubernetes.io/instance: rel
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hse-doc-studio-0.1.0
    app.kubernetes.io/component: runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hse-doc-studio
      app.kubernetes.io/instance: rel
      app.kubernetes.io/component: runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hse-doc-studio
        app.kubernetes.io/instance: rel
        app.kubernetes.io/component: runner
    spec:
      # Этот раннер работает через docker.sock, а не Kubernetes API: токен ServiceAccount ему не нужен.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        supplementalGroups: [0]
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # hostPath создаётся от root, fsGroup на него не действует: отдаём каталог пользователю раннера.
        - name: fix-data-dir
          image: ghcr.io/alexeyshalaev/hse-doc-studio:latest
          imagePullPolicy: IfNotPresent
          command: ["chown", "-R", "10001:10001", "/var/lib/hse-runner"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL], add: [CHOWN, DAC_OVERRIDE]}
          volumeMounts:
            - {name: runner-data, mountPath: "/var/lib/hse-runner"}
      containers:
        - name: runner
          image: ghcr.io/alexeyshalaev/hse-doc-studio:latest
          imagePullPolicy: IfNotPresent
          command: ["hse-doc-studio", "runner"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          env:
            - {name: HSE_RUNNER__API_URL, value: "http://rel-hse-doc-studio:8000"}
            - {name: HSE_RUNNER__DATA_DIR, value: "/var/lib/hse-runner"}
            - {name: HSE_RUNNER__CONCURRENCY, value: "1"}
            - {name: HSE_RUNNER__TAGS, value: "tex"}
            # Нужен один раз: выданный раннеру токен сохраняется в его каталоге данных.
            - {name: HSE_RUNNER__TOKEN, valueFrom: {secretKeyRef: {name: rel-hse-doc-studio-secrets, key: runner-bootstrap-token}}}
          volumeMounts:
            - {name: runner-data, mountPath: "/var/lib/hse-runner"}
            - {name: docker-sock, mountPath: /var/run/docker.sock}
          resources:
            limits:
              cpu: "1"
              ephemeral-storage: 2Gi
              memory: 2Gi
            requests:
              cpu: 100m
              ephemeral-storage: 128Mi
              memory: 256Mi
      volumes:
        - name: runner-data
          hostPath: {path: "/var/lib/hse-runner", type: DirectoryOrCreate}
        - name: docker-sock
          hostPath: {path: "/var/run/docker.sock", type: Socket}

