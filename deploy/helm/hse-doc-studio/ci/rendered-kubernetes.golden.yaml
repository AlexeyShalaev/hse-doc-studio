# Source: hse-doc-studio/templates/runner-kubernetes.yaml
# Только поды сборки в своём namespace: создать, ждать, читать лог, exec для входа и выхода, удалить.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rel-hse-doc-studio-runner-builds
  namespace: hds-builds
  labels:
    app.kubernetes.io/name: hse-doc-studio
    app.kubernetes.io/instance: rel
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hse-doc-studio-0.1.0
    app.kubernetes.io/component: runner
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, list, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  # websocket-exec авторизуется как get в старых версиях Kubernetes и как create в новых.
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create, get]

