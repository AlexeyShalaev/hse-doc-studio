# Source: hse-doc-studio/templates/runner-kubernetes.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rel-hse-doc-studio-runner
  labels:
    app.kubernetes.io/name: hse-doc-studio
    app.kubernetes.io/instance: rel
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hse-doc-studio-0.1.0
    app.kubernetes.io/component: runner
spec:
  replicas: 1
  # Том данных ReadWriteOnce: старый под отпускает его до старта нового.
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: hse-doc-studio
      app.kubernetes.io/instance: rel
      app.kubernetes.io/component: runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hse-doc-studio
        app.kubernetes.io/instance: rel
        app.kubernetes.io/component: runner
    spec:
      serviceAccountName: rel-hse-doc-studio-runner
      # Токен нужен: раннер создаёт поды сборки через Kubernetes API (права: Role выше, только поды сборки).
      automountServiceAccountToken: true
      enableServiceLinks: false
      # На SIGTERM раннер перестаёт брать задачи и дорабатывает текущие сборки.
      terminationGracePeriodSeconds: 600
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: runner
          image: ghcr.io/alexeyshalaev/hse-doc-studio:latest
          imagePullPolicy: IfNotPresent
          command: ["hse-doc-studio", "runner"]
          env:
            - {name: HSE_RUNNER__API_URL, value: "http://rel-hse-doc-studio:8000"}
            - {name: HSE_RUNNER__DATA_DIR, value: "/var/lib/hse-runner"}
            - {name: HSE_RUNNER__CONCURRENCY, value: "1"}
            - {name: HSE_RUNNER__TAGS, value: "tex"}
            # Нужен один раз: выданный раннеру токен сохраняется на его томе данных.
            - {name: HSE_RUNNER__TOKEN, valueFrom: {secretKeyRef: {name: rel-hse-doc-studio-secrets, key: runner-bootstrap-token}}}
            # Постоянный токен раннера (hsrn_…), если он в Secret: тогда том данных не обязателен.
            - {name: HSE_RUNNER__RUNNER_TOKEN, valueFrom: {secretKeyRef: {name: rel-hse-doc-studio-secrets, key: runner-token, optional: true}}}
            - {name: HSE_RUNNER__EXECUTOR, value: kubernetes}
            - {name: HSE_RUNNER__K8S__NAMESPACE, value: "hds-builds"}
            - {name: HSE_RUNNER__K8S__OWNER_POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: HSE_RUNNER__K8S__OWNER_POD_UID, valueFrom: {fieldRef: {fieldPath: metadata.uid}}}
            # Свой под из downward API: раннер сообщает в админку, как он развёрнут (на работу не влияет).
            - {name: HSE_RUNNER__POD__NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
            - {name: HSE_RUNNER__POD__NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: HSE_RUNNER__POD__SERVICE_ACCOUNT, valueFrom: {fieldRef: {fieldPath: spec.serviceAccountName}}}
            - {name: HSE_RUNNER__POD__CPU_REQUEST_M, valueFrom: {resourceFieldRef: {containerName: runner, resource: requests.cpu, divisor: 1m}}}
            - {name: HSE_RUNNER__POD__CPU_LIMIT_M, valueFrom: {resourceFieldRef: {containerName: runner, resource: limits.cpu, divisor: 1m}}}
            - {name: HSE_RUNNER__POD__MEMORY_REQUEST_MI, valueFrom: {resourceFieldRef: {containerName: runner, resource: requests.memory, divisor: 1Mi}}}
            - {name: HSE_RUNNER__POD__MEMORY_LIMIT_MI, valueFrom: {resourceFieldRef: {containerName: runner, resource: limits.memory, divisor: 1Mi}}}
            - {name: HSE_RUNNER__POD__EPHEMERAL_REQUEST_MI, valueFrom: {resourceFieldRef: {containerName: runner, resource: requests.ephemeral-storage, divisor: 1Mi}}}
            - {name: HSE_RUNNER__POD__EPHEMERAL_LIMIT_MI, valueFrom: {resourceFieldRef: {containerName: runner, resource: limits.ephemeral-storage, divisor: 1Mi}}}
            - {name: HSE_RUNNER__K8S__IMAGE_PULL_POLICY, value: "IfNotPresent"}
            - {name: HSE_RUNNER__K8S__CPU_REQUEST, value: "500m"}
            - {name: HSE_RUNNER__K8S__MEMORY_REQUEST, value: "1Gi"}
            - {name: HSE_RUNNER__K8S__CPU_LIMIT, value: "2"}
            - {name: HSE_RUNNER__K8S__MEMORY_LIMIT, value: "4Gi"}
            - {name: HSE_RUNNER__K8S__EPHEMERAL_STORAGE_REQUEST, value: "1Gi"}
            - {name: HSE_RUNNER__K8S__EPHEMERAL_STORAGE_LIMIT, value: "4Gi"}
            - {name: HSE_RUNNER__K8S__WORK_SIZE_LIMIT, value: "2Gi"}
            - {name: HSE_RUNNER__K8S__TMP_SIZE_LIMIT, value: "1Gi"}
            - {name: HSE_RUNNER__K8S__ACTIVE_DEADLINE_S, value: "1800"}
            - {name: HSE_RUNNER__K8S__POD_START_TIMEOUT_S, value: "300"}
            - {name: HSE_RUNNER__K8S__RUN_AS_USER, value: "1000"}
            - {name: HSE_RUNNER__K8S__RUN_AS_GROUP, value: "1000"}
            - {name: HSE_RUNNER__K8S__FS_GROUP, value: "1000"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: runner-data, mountPath: "/var/lib/hse-runner"}
            - {name: tmp, mountPath: /tmp}
          resources:
            limits:
              cpu: "1"
              ephemeral-storage: 2Gi
              memory: 2Gi
            requests:
              cpu: 100m
              ephemeral-storage: 128Mi
              memory: 256Mi
      volumes:
        - name: runner-data
          persistentVolumeClaim: {claimName: rel-hse-doc-studio-runner-data}
        - name: tmp
          emptyDir: {sizeLimit: "1Gi"}

