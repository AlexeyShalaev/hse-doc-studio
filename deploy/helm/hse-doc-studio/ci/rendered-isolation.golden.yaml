# Source: hse-doc-studio/templates/runner-kubernetes.yaml
# Подам сборки сеть не нужна: вход и выход идут через exec Kubernetes API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rel-hse-doc-studio-runner-builds-deny-all
  namespace: hds-builds
  labels:
    app.kubernetes.io/name: hse-doc-studio
    app.kubernetes.io/instance: rel
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hse-doc-studio-0.1.0
    app.kubernetes.io/component: runner
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: hse-doc-studio-runner
      hse-doc-studio/component: build
  policyTypes: [Ingress, Egress]

---
# Source: hse-doc-studio/templates/runner-networkpolicy.yaml
# Поды сборки раннеров из админки живут в namespace релиза. Сеть им не нужна: вход и выход идут через exec API.
apiVersion: networking.k8s.io/v1
