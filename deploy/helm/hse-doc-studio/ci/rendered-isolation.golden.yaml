apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rel-hse-doc-studio
  labels:
    app.kubernetes.io/name: hse-doc-studio
    app.kubernetes.io/instance: rel
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hse-doc-studio-0.1.0
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 512m
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "75"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "75"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["studio.example.org"]
      secretName: studio-tls
  rules:
    - host: "studio.example.org"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rel-hse-doc-studio
                port: {number: 8000}
