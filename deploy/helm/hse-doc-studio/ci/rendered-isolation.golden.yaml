# Source: hse-doc-studio/templates/runner-build-quota.yaml
# Общий потолок подов сборки (docs/en/deploy/runner-isolation.md). Поды сборки задают requests и limits сами,
# поэтому под квоту на память и CPU они подходят.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: rel-hse-doc-studio-builds
  namespace: hds-builds
  labels:
    app.kubernetes.io/name: hse-doc-studio
    app.kubernetes.io/instance: rel
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hse-doc-studio-0.1.0
    app.kubernetes.io/component: runner
spec:
  hard:
    pods: "20"
    requests.cpu: "10"
    requests.memory: "20Gi"
    limits.cpu: "40"
    limits.memory: "80Gi"
    requests.ephemeral-storage: "20Gi"
    limits.ephemeral-storage: "80Gi"

---
# Source: hse-doc-studio/templates/runner-build-quota.yaml
apiVersion: v1
kind: LimitRange
metadata:
  name: rel-hse-doc-studio-builds
  namespace: hds-builds
  labels:
    app.kubernetes.io/name: hse-doc-studio
    app.kubernetes.io/instance: rel
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hse-doc-studio-0.1.0
    app.kubernetes.io/component: runner
spec:
  limits:
    - type: Container
      default:
        cpu: "1"
        ephemeral-storage: 2Gi
        memory: 2Gi
      defaultRequest:
        cpu: 250m
        ephemeral-storage: 256Mi
        memory: 512Mi
      max:
        cpu: "8"
        ephemeral-storage: 8Gi
        memory: 16Gi

