---
# Source: hse-doc-studio/templates/api.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rel-hse-doc-studio-api
  labels:
    app.kubernetes.io/name: hse-doc-studio
    app.kubernetes.io/instance: rel
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hse-doc-studio-0.1.0
    app.kubernetes.io/component: api
spec:
  # Одна реплика и Recreate: том проектов пишется одним процессом, две копии не должны жить одновременно.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hse-doc-studio
      app.kubernetes.io/instance: rel
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hse-doc-studio
        app.kubernetes.io/instance: rel
        app.kubernetes.io/component: api
      annotations:
        checksum/secret: 3d4af20705b72dc5a7dd296489f57e02b20395a134958a3730b60e804bee7f94
    spec:
      serviceAccountName: rel-hse-doc-studio-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
        fsGroup: 10001
      containers:
        - name: api
          image: ghcr.io/alexeyshalaev/hse-doc-studio:latest
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          env:
            - {name: HSE_STUDIO__MODE, value: server}
            - {name: HSE_STUDIO__SERVER__HOST, value: "0.0.0.0"}
            - {name: HSE_STUDIO__SERVER__PORT, value: "8000"}
            - {name: HSE_STUDIO__DATA_DIR, value: /data}
