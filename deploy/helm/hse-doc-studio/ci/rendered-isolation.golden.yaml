---
# Source: hse-doc-studio/templates/runner-networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rel-hse-doc-studio-runner-egress
  namespace: studio
  labels:
    app.kubernetes.io/name: hse-doc-studio
    app.kubernetes.io/instance: rel
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hse-doc-studio-0.1.0
    app.kubernetes.io/component: runner
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: runner
      app.kubernetes.io/instance: rel
      app.kubernetes.io/name: hse-doc-studio
  policyTypes: [Egress]
  egress:
    # DNS: только порт 53 (kube-dns и node-local-dns лежат в разных namespace).
    - to:
        - namespaceSelector: {}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    # Студия: задачи, исходники, результат.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hse-doc-studio
              app.kubernetes.io/instance: rel
              app.kubernetes.io/component: api
      ports:
        - {protocol: TCP, port: 8000}
    # Kubernetes API: создание и exec подов сборки.
    - to:
        - ipBlock: {cidr: "192.168.49.2/32"}
      ports:
        - {protocol: TCP, port: 8443}
    - ports:
      - port: 443
        protocol: TCP
      to:
      - ipBlock:
          cidr: 203.0.113.10/32

