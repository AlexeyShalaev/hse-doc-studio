# Source: hse-doc-studio/templates/api.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rel-hse-doc-studio-api
  labels:
    app.kubernetes.io/name: hse-doc-studio
    app.kubernetes.io/instance: rel
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hse-doc-studio-0.1.0
    app.kubernetes.io/component: api
spec:
  # Одна реплика и Recreate: том проектов пишется одним процессом, две копии не должны жить одновременно.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hse-doc-studio
      app.kubernetes.io/instance: rel
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hse-doc-studio
        app.kubernetes.io/instance: rel
        app.kubernetes.io/component: api
      annotations:
        checksum/secret: 722c37bc0a56dfd9694eb023e4d8ceddf564839691f38233cef8f9f74243d6f4
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
        fsGroup: 10001
      containers:
        - name: api
          image: ghcr.io/alexeyshalaev/hse-doc-studio:latest
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          env:
            - {name: HSE_STUDIO__MODE, value: server}
            - {name: HSE_STUDIO__SERVER__HOST, value: "0.0.0.0"}
            - {name: HSE_STUDIO__SERVER__PORT, value: "8000"}
            - {name: HSE_STUDIO__DATA_DIR, value: /data}
            - {name: HSE_STUDIO__LOGGING__USE_JSON, value: "true"}
            - {name: HSE_STUDIO__AUTH__PUBLIC_URL, value: "https://studio.example.org"}
            - {name: HSE_STUDIO__AUTH__TRUSTED_PROXIES, value: "[\"10.0.0.0/8\"]"}
            - {name: HSE_STUDIO__S3__ENDPOINT, value: "https://s3.example.org"}
            - {name: HSE_STUDIO__S3__BUCKET, value: "studio"}
            - {name: HSE_STUDIO__S3__REGION, value: ""}
            - {name: HSE_STUDIO__MAIL__HOST, value: ""}
            - {name: HSE_STUDIO__MAIL__PORT, value: "587"}
            - {name: HSE_STUDIO__MAIL__USERNAME, value: ""}
            - {name: HSE_STUDIO__MAIL__FROM_ADDRESS, value: "no-reply@localhost"}
            - {name: HSE_STUDIO__LANGUAGETOOL__POOL_REPLICAS, value: "[\"http://languagetool-0.lt:8010\",\"http://languagetool-1.lt:8010\"]"}
            - {name: HSE_STUDIO__OFFICE_EDITOR__POOL_REPLICAS, value: "[\"http://onlyoffice.example.org\"]"}
            - {name: HSE_STUDIO__OFFICE_EDITOR__BACKEND_INTERNAL_URL, value: "http://rel-hse-doc-studio:8000"}
            - {name: HSE_STUDIO__DB__DSN, valueFrom: {secretKeyRef: {name: rel-hse-doc-studio-secrets, key: dsn}}}
            - {name: HSE_STUDIO__SECRETS__KEY, valueFrom: {secretKeyRef: {name: rel-hse-doc-studio-secrets, key: secrets-key}}}
            - {name: HSE_STUDIO__S3__ACCESS_KEY, valueFrom: {secretKeyRef: {name: rel-hse-doc-studio-secrets, key: s3-access-key}}}
            - {name: HSE_STUDIO__S3__SECRET_KEY, valueFrom: {secretKeyRef: {name: rel-hse-doc-studio-secrets, key: s3-secret-key}}}
            - {name: HSE_STUDIO__JOBS__RUNNER_BOOTSTRAP_TOKEN, valueFrom: {secretKeyRef: {name: rel-hse-doc-studio-secrets, key: runner-bootstrap-token, optional: true}}}
            - {name: HSE_STUDIO__MAIL__PASSWORD, valueFrom: {secretKeyRef: {name: rel-hse-doc-studio-secrets, key: smtp-password, optional: true}}}
            - {name: HSE_STUDIO__OBSERVABILITY__HEALTH_TOKEN, valueFrom: {secretKeyRef: {name: rel-hse-doc-studio-secrets, key: health-token, optional: true}}}
            - {name: HSE_STUDIO__OBSERVABILITY__METRICS_TOKEN, valueFrom: {secretKeyRef: {name: rel-hse-doc-studio-secrets, key: metrics-token, optional: true}}}
            - {name: HSE_STUDIO__OFFICE_EDITOR__JWT_SECRET, valueFrom: {secretKeyRef: {name: rel-hse-doc-studio-secrets, key: office-jwt-secret, optional: true}}}
            # Первая установка: схему ведёт сам api под advisory-локом. Дальше её обновляет Job pre-upgrade.
            - {name: HSE_STUDIO__DB__AUTO_MIGRATE, value: "true"}
          volumeMounts:
            - {name: data, mountPath: /data}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
            failureThreshold: 6
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rel-hse-doc-studio-data

