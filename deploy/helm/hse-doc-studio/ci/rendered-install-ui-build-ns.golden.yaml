            - {name: HSE_STUDIO__BACKUPS__PROVISION__SECRET_KEY, valueFrom: {secretKeyRef: {name: rel-hse-doc-studio-secrets, key: backup-secret-key, optional: true}}}
            - {name: HSE_STUDIO__BACKUPS__PROVISION__SCHEDULE_ENABLED, value: "true"}
