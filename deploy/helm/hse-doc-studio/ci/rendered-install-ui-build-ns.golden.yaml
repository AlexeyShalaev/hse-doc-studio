            - {name: HSE_STUDIO__RUNNER_INSTALL__KUBERNETES_BUILD_NAMESPACE, value: "hds-ui-builds"}
            # Экран изоляции раннеров в админке: что задано в чарте (не проверенное в кластере).
            - {name: HSE_STUDIO__RUNNER_CLUSTER__DECLARED, value: "{\"build\":{\"activeDeadlineSeconds\":1800,\"limitRange\":{\"default\":{\"cpu\":\"1\",\"ephemeral-storage\":\"2Gi\",\"memory\":\"2Gi\"},\"defaultRequest\":{\"cpu\":\"250m\",\"ephemeral-storage\":\"256Mi\",\"memory\":\"512Mi\"},\"enabled\":false,\"max\":{\"cpu\":\"8\",\"ephemeral-storage\":\"8Gi\",\"memory\":\"16Gi\"}},\"namespace\":\"studio\",\"networkPolicy\":true,\"quota\":{\"enabled\":false,\"hard\":{\"limits.cpu\":\"40\",\"limits.ephemeral-storage\":\"80Gi\",\"limits.memory\":\"80Gi\",\"pods\":\"20\",\"requests.cpu\":\"10\",\"requests.ephemeral-storage\":\"20Gi\",\"requests.memory\":\"20Gi\"}},\"resources\":{\"limits\":{\"cpu\":\"2\",\"ephemeral-storage\":\"4Gi\",\"memory\":\"4Gi\"},\"requests\":{\"cpu\":\"500m\",\"ephemeral-storage\":\"1Gi\",\"memory\":\"1Gi\"}},\"runAsUser\":1000,\"runtimeClassName\":\"\",\"tmpSizeLimit\":\"1Gi\",\"workSizeLimit\":\"2Gi\"},\"officeConvert\":{\"enabled\":false,\"image\":\"\",\"networkPolicy\":false,\"replicas\":0,\"resources\":{},\"url\":\"\"},\"releaseNamespace\":\"studio\",\"runner\":{\"deployment\":\"rel-hse-doc-studio-runner\",\"enabled\":true,\"executor\":\"docker\",\"officeUrl\":\"\",\"replicas\":1,\"resources\":{\"limits\":{\"cpu\":\"1\",\"ephemeral-storage\":\"2Gi\",\"memory\":\"2Gi\"},\"requests\":{\"cpu\":\"100m\",\"ephemeral-storage\":\"128Mi\",\"memory\":\"256Mi\"}},\"runAsUser\":10001,\"serviceAccount\":\"\",\"storageClass\":\"\",\"storageKind\":\"hostPath\",\"storageSize\":\"\",\"tmpSizeLimit\":\"\"},\"runnerEgress\":{\"apiServerCidrs\":[],\"apiServerPorts\":[443,6443],\"enabled\":false,\"extraRules\":0,\"officePort\":null,\"studioPort\":8000},\"uiBuild\":{\"enabled\":true,\"limitRange\":true,\"namespace\":\"hds-ui-builds\",\"networkPolicy\":true,\"quota\":true}}"}
            # Права на чтение NetworkPolicy, ResourceQuota, LimitRange и своих namespace: runner-isolation-read.yaml.
            - {name: HSE_STUDIO__RUNNER_CLUSTER__READ_LIVE, value: "true"}
