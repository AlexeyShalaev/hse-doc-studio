    resources: [deployments]
    verbs: [create, list, update, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, delete]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [create, delete]

