# Значения по умолчанию. Секреты в values не храните: используйте secrets.existingSecret.
# Postgres и S3 внешние, в чарт они не входят.

image:
  repository: ghcr.io/alexeyshalaev/hse-doc-studio
  # Пусто значит appVersion чарта.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Внешний адрес Студии (обязательно): по схеме выбирается Secure у cookie, адрес входит в допустимые Origin.
publicUrl: ""
# Обратные прокси перед api: IP или CIDR, по ним определяется адрес клиента.
trustedProxies: []

# Числовые uid/gid пользователя app из образа (см. deploy/all-in-one/Dockerfile): без них runAsNonRoot не проходит.
podSecurityContext:
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

# Реплика одна, стратегия Recreate: том проектов монтируется ReadWriteOnce и пишется одним процессом.
api:
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 2Gi}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  # Дополнительные HSE_STUDIO__* (имя: значение), например HSE_STUDIO__LOGGING__LEVEL.
  extraEnv: {}

# Том исходников проектов (projects_root/<project_id>) и данных api.
persistence:
  enabled: true
  existingClaim: ""
  storageClassName: ""
  accessModes: [ReadWriteOnce]
  size: 20Gi
  annotations: {}

# Внешний Postgres. DSN лежит в секрете (ключ dsn), см. secrets.
database:
  dsn: ""

s3:
  # Внутренний адрес S3: по нему ходят api и раннеры внутри сети кластера.
  endpoint: ""
  bucket: studio
  region: ""
  accessKey: ""
  secretKey: ""
  # Публичный адрес S3 (https://s3.example.org) для всех, кто вне сети кластера: браузеры, личные раннеры
  # и локальные Студии. Ссылки подписываются сразу для этого хоста. Пусто значит, что они получают внутренний
  # адрес и не откроют его. Как опубликовать хранилище: docs/ru/deploy/runners.md, «Раннеры вне сети сервера».
  publicEndpoint: ""
  # Как раннеры вне сети обмениваются файлами с хранилищем: presigned (ссылки на публичный адрес)
  # или proxy (поток через api, без публикации S3; нагрузка идёт через api).
  outsideRunnerAccess: presigned
  # Считать внешними и общие раннеры (по умолчанию внешние только личные).
  sharedRunnersOutside: false
  # Источники, которым бакет разрешает читать подписанные ссылки (CORS, нужен pdf.js; MinIO отвечает всем сам).
  corsOrigins: []

# Бэкапы (см. docs/ru/deploy/backups.md). При enabled=false чарт ничего не добавляет: приложение работает с
# умолчаниями, назначения и расписание админ задаёт сам в админке.
# При enabled=true чарт на первом старте создаёт назначение по умолчанию и расписание (только если назначений ещё нет:
# правки в админке рестарты переживают) и, при local.enabled, отдельный том под локальные бэкапы.
backups:
  enabled: false
  # Локальное назначение: отдельный PVC `<release>-backups`, монтируется в /backups (HSE_STUDIO__BACKUPS__LOCAL_ROOT).
  # Бэкап на том же томе, что и данные, не защищает от потери тома: берите другой класс хранения или внешний S3.
  local:
    enabled: false
    persistence:
      existingClaim: ""
      storageClassName: ""
      accessModes: [ReadWriteOnce]
      size: 50Gi
      annotations: {}
  destination:
    # local (подкаталог тома бэкапов) или s3
    kind: local
    name: default
    # kind=local: подкаталог корня /backups
    path: main
    # kind=s3: bucket обязателен, ключи ниже (или в Secret: backup-access-key, backup-secret-key)
    endpoint: ""
    region: us-east-1
    bucket: ""
    prefix: ""
    pathStyle: true
    accessKey: ""
    secretKey: ""
  schedule:
    enabled: true
    # interval (каждые intervalHours часов) или cron (пять полей, UTC)
    kind: interval
    intervalHours: 24
    cron: "0 3 * * *"
    keepLast: 7
    keepDays: 30
  # installation (ключ из SECRETS_KEY) или passphrase (парольная фраза от 12 символов в passphrase или в Secret: backup-passphrase)
  encryptionMode: installation
  passphrase: ""
  notifyAdmins: true

mail:
  host: ""
  port: 587
  username: ""
  password: ""
  fromAddress: no-reply@localhost

# Секреты. Либо существующий Secret с ключами из списка ниже, либо чарт создаст свой из значений.
# Ключи: dsn, secrets-key, s3-access-key, s3-secret-key, runner-bootstrap-token,
# а также необязательные smtp-password, health-token, metrics-token, office-jwt-secret,
# backup-access-key, backup-secret-key, backup-passphrase.
secrets:
  existingSecret: ""
  # Ключ шифрования секретов в базе (Fernet). Потеря делает сохранённые секреты нечитаемыми.
  secretsKey: ""
  runnerBootstrapToken: ""
  healthToken: ""
  metricsToken: ""
  # Общий секрет JWT реплик ONLYOFFICE; пусто значит секрет выводится из ключа шифрования.
  officeJwtSecret: ""

# Внешние реплики сервисов (в чарт не входят). Пустой список значит, что сервис недоступен.
services:
  # Адреса реплик LanguageTool, например ["http://languagetool-0.lt:8010"].
  languagetoolReplicas: []
  # Адреса реплик ONLYOFFICE Document Server.
  officeEditorReplicas: []
  # Адрес api глазами реплик ONLYOFFICE (документ и обратный вызов); пусто значит имя Service чарта.
  backendInternalUrl: ""

# Серверы ИИ-моделей (Ollama, vLLM, SGLang), которые админ ставит из интерфейса.
modelServers:
  local:
    # Установка на узле со Студией запускает соседние контейнеры через docker.sock узла, а он эквивалентен root на узле.
    # В кластере выключена: поды api не получают сокет, а установка по SSH на другую машину от этого значения не зависит.
    # Включайте только для всех-в-одном на выделенном узле, где api смонтирован docker.sock (см. docs/ru/deploy).
    enabled: false

# Миграции схемы выполняет отдельный Job перед обновлением (helm pre-upgrade).
# На первой установке схему ведёт сам api под advisory-локом.
migrations:
  enabled: true
  backoffLimit: 1
  activeDeadlineSeconds: 600
  resources: {}

# Обновление версии из админки в Kubernetes (docs/design/auto-update.md, раздел 5a). По умолчанию выключено:
# тогда версию ставит оператор (helm upgrade --atomic или GitOps), страница «Обновления» показывает команду.
# enabled=true добавляет сервис updater со своим ServiceAccount. Его Role строго на namespace релиза: get и patch одного
# Deployment api по имени, Job (create, get, list, watch, delete), pods и pods/log только на чтение. Секреты, ClusterRole
# и чужие namespace недоступны. Снимка базы нет: перед обновлением идёт полный бэкап (раздел «Бэкапы») или нужно
# подтвердить риск; откат образа возможен, пока миграции не менялись, иначе статус «Нужны руки».
updater:
  enabled: false
  # Общий секрет api и апдейтера (Bearer). Или ключ updater-token в secrets.existingSecret.
  token: ""
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  # Сколько ждать: остановку api, миграции (Job), здоровье новой версии, старт пода Job (pull образа).
  stopTimeoutSeconds: 180
  migrateTimeoutSeconds: 3600
  healthTimeoutSeconds: 300
  podStartTimeoutSeconds: 300

ingress:
  enabled: false
  className: ""
  host: ""
  # Долгий опрос раннера держит запрос до 25 секунд: таймаут чтения не меньше 60 секунд, буферизация выключена.
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "75"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "75"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-body-size: 512m
  tls:
    enabled: false
    secretName: ""

service:
  type: ClusterIP
  port: 8000

# Раннер задач. Исполнитель сборки TeX (runner.executor):
# - docker (по умолчанию): соседние контейнеры через docker.sock узла (hostPath). Сокет эквивалентен root на узле,
#   включайте только на выделенных узлах (nodeSelector); под раннера не проходит Pod Security restricted.
# - kubernetes: под на задачу в своём namespace через Kubernetes API (ServiceAccount, Role только на поды),
#   без docker.sock и hostPath; под раннера и поды сборки проходят restricted. См. docs/design/k8s-runner.md.
runner:
  enabled: false
  executor: docker
  # Не больше 1: токен регистрации одноразовый, а в режиме docker поды узла ещё и делят hostPath.
  replicas: 1
  concurrency: 1
  tags: ""
  officeUrl: ""
  # Каталог данных раннера. В режиме docker соседние контейнеры видят пути узла, поэтому hostPath монтируется
  # по тому же пути; в режиме kubernetes это точка монтирования тома runner.persistence.
  dataDir: /var/lib/hse-runner
  dockerSocket: /var/run/docker.sock
  dockerGid: 0
  # Каталог на узле создаётся от root (hostPath, fsGroup на него не действует): раннер доходит до него
  # через initContainer, который выдаёт его пользователю podSecurityContext.
  # Под раннера только ставит задачи и гоняет файлы (TeX считают поды сборки или docker рядом), поэтому небольшой.
  # Память с запасом: раннер хеширует и пакует исходники, а при concurrency > 1 держит несколько сборок сразу.
  resources:
    requests: {cpu: 100m, memory: 256Mi, ephemeral-storage: 128Mi}
    limits: {cpu: "1", memory: 2Gi, ephemeral-storage: 2Gi}
  # Размер /tmp пода раннера (спул выгрузки результата сборки, до 512 МиБ).
  tmpSizeLimit: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Исходящая сеть подов раннера (chart-раннер и раннеры из админки). По умолчанию выключено: адреса, которые нужны
  # раннеру (Kubernetes API, объектное хранилище S3, если оно вне кластера), чарт знать не может, а неверный список
  # оставит раннеры без связи. Включайте после проверки (docs/en/deploy/runner-isolation.md). Разрешено: DNS, Студия
  # (api этого релиза), Kubernetes API по портам apiServerPorts, плюс extraEgress.
  networkPolicy:
    enabled: false
    # Адреса Kubernetes API (CIDR узлов control plane или `kubernetes` Service после DNAT). Пусто: порты
    # apiServerPorts на любые адреса, кроме link-local (169.254.0.0/16: metadata облака).
    apiServerCidrs: []
    apiServerPorts: [443, 6443]
    # Свои egress-правила дословно (spec.egress): S3 вне кластера, внешний OnlyOffice и прочее нужное раннеру.
    extraEgress: []
  # Только executor=kubernetes: сколько ждать доработки текущих сборок при остановке пода раннера.
  terminationGracePeriodSeconds: 600
  # Только executor=kubernetes: том данных раннера (identity.json с выданным токеном, кэш блобов, рабочие папки).
  # enabled=false даёт emptyDir: тогда положите постоянный токен раннера в Secret (ключ runner-token).
  persistence:
    enabled: true
    existingClaim: ""
    storageClassName: ""
    accessModes: [ReadWriteOnce]
    size: 10Gi
  # Установка раннеров из админки Студии в этот кластер (кнопка «На этой же машине» на странице раннеров).
  # По умолчанию выключено: общие раннеры на проде включают сознательно. Включение даёт ServiceAccount Студии
  # права create/get/list/delete на Deployment, create/delete на Secret и PVC в namespace релиза.
  installFromUi:
    enabled: false
    # Namespace подов сборки таких раннеров; пусто значит namespace релиза. Сам раннер (Deployment, Secret с токеном,
    # том данных) остаётся в namespace релиза. Чарт namespace не создаёт: он должен существовать с меткой
    # pod-security.kubernetes.io/enforce=restricted. В отдельном namespace подам сборки достаются и квота с LimitRange
    # из runner.kubernetes.quota и limitRange (при общем namespace с runner.kubernetes.namespace по одному объекту).
    # Права раннеров на поды сборки (Role и RoleBinding) чарт тогда ставит туда, в namespace релиза их нет.
    buildNamespace: ""
    storageClassName: ""
    storageSize: 5Gi
    # Лимиты раннера, поставленного из админки: умолчания формы установки. В форме админ может задать свои
    # (limits.cpu и limits.memory), бэкенд проверяет их по нижним границам (раннер 100m и 256Mi, поды сборки
    # 500m и 1Gi) и по верхним maxCpu и maxMemory; requests подбираются под лимит.
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 2Gi}
    # Поды сборки таких раннеров (создаёт сам раннер, в buildNamespace).
    buildResources:
      requests: {cpu: 500m, memory: 1Gi}
      limits: {cpu: "2", memory: 4Gi}
    maxCpu: "8"
    maxMemory: 16Gi
  # Экран «Изоляция раннеров» в админке. Что задано в чарте, Студия знает всегда (это не проверка кластера).
  # readCluster=true выдаёт ServiceAccount Студии чтение (get, list) NetworkPolicy, ResourceQuota и LimitRange в
  # namespace релиза и подов сборки (runner.kubernetes.namespace и installFromUi.buildNamespace) и get на эти
  # namespace (метки Pod Security, ClusterRole с resourceNames):
  # тогда экран показывает, что реально есть в кластере. По умолчанию выключено: прав у Студии не прибавляется.
  isolationInfo:
    readCluster: false
  # Только executor=kubernetes: поды сборки.
  kubernetes:
    # Namespace подов сборки; пусто значит namespace релиза. Свой namespace должен существовать; пометьте его
    # pod-security.kubernetes.io/enforce=restricted.
    namespace: ""
    # Образ TeX подов; пусто значит образ раннера по умолчанию (texlive/texlive:TL2024-historic).
    image: ""
    imagePullPolicy: IfNotPresent
    # Имена Secret для pull образа TeX в namespace подов сборки.
    imagePullSecrets: []
    # Память: XeLaTeX обычного документа (ГОСТ-шаблон, десятки страниц, рисунки) занимает 0.5-1.5 ГиБ, большие
    # TikZ и растровые рисунки до 3 ГиБ. Предел 4Gi держит запас; под, убитый по памяти, получает у пользователя код
    # build_out_of_memory с пояснением. ephemeral-storage: /work + /tmp (workSizeLimit + tmpSizeLimit) и логи.
    resources:
      requests: {cpu: 500m, memory: 1Gi, ephemeral-storage: 1Gi}
      limits: {cpu: "2", memory: 4Gi, ephemeral-storage: 4Gi}
    # emptyDir /work (исходники и .build) и /tmp (форматы TeX).
    workSizeLimit: 2Gi
    tmpSizeLimit: 1Gi
    # Страховка на случай смерти раннера; обычный предел времени задачи держит api.
    activeDeadlineSeconds: 1800
    # Первый pull многогигабайтного образа TeX на узле занимает минуты.
    podStartTimeoutSeconds: 300
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    nodeSelector: {}
    tolerations: []
    priorityClassName: ""
    # gvisor или kata для общих установок, если RuntimeClass есть в кластере.
    runtimeClassName: ""
    # Необязательный PVC с кэшем шрифтов TeX (/cache). Нужен ReadWriteMany либо один узел.
    texCache:
      existingClaim: ""
    # Необязательный PVC со шрифтами (.ttf, .otf, .ttc): монтируется в поды сборки только для чтения,
    # чтобы XeLaTeX находил Times New Roman, Arial и Consolas. Шрифты Microsoft в образы не входят.
    fonts:
      existingClaim: ""
    # Запрет всей сети подам сборки (нужен CNI с поддержкой NetworkPolicy). Действует и для подов сборки раннеров,
    # поставленных из админки (installFromUi, в их buildNamespace). Подам сеть не нужна: исходники и результат идут
    # через exec API.
    networkPolicy:
      enabled: true
    # ResourceQuota на namespace подов сборки: общий потолок, чтобы шторм сборок не съел кластер. Только для
    # отдельного namespace: runner.kubernetes.namespace у раннера чарта и runner.installFromUi.buildNamespace у
    # раннеров из админки (не пуст и не равен namespace релиза). Каждый такой namespace получает свою квоту с этими
    # значениями; общий потолок на оба вида раннеров даёт один namespace на двоих.
    quota:
      enabled: false
      pods: "20"
      requestsCpu: "10"
      requestsMemory: 20Gi
      limitsCpu: "40"
      limitsMemory: 80Gi
      requestsEphemeralStorage: 20Gi
      limitsEphemeralStorage: 80Gi
    # LimitRange того же namespace: умолчания и потолок на контейнер для подов без своих значений. Поды сборки
    # свои значения задают, LimitRange страхует от чужих подов в этом namespace.
    limitRange:
      enabled: false
      default: {cpu: "1", memory: 2Gi, ephemeral-storage: 2Gi}
      defaultRequest: {cpu: 250m, memory: 512Mi, ephemeral-storage: 256Mi}
      max: {cpu: "8", memory: 16Gi, ephemeral-storage: 8Gi}
