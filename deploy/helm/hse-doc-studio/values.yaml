# Значения по умолчанию. Секреты в values не храните: используйте secrets.existingSecret.
# Postgres и S3 внешние, в чарт они не входят.

image:
  repository: ghcr.io/alexeyshalaev/hse-doc-studio
  # Пусто значит appVersion чарта.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Внешний адрес Студии (обязательно): по схеме выбирается Secure у cookie, адрес входит в допустимые Origin.
publicUrl: ""
# Обратные прокси перед api: IP или CIDR, по ним определяется адрес клиента.
trustedProxies: []

# Числовые uid/gid пользователя app из образа (см. deploy/all-in-one/Dockerfile): без них runAsNonRoot не проходит.
podSecurityContext:
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

# Реплика одна, стратегия Recreate: том проектов монтируется ReadWriteOnce и пишется одним процессом.
api:
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 2Gi}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  # Дополнительные HSE_STUDIO__* (имя: значение), например HSE_STUDIO__LOGGING__LEVEL.
  extraEnv: {}

# Том исходников проектов (projects_root/<project_id>) и данных api.
persistence:
  enabled: true
  existingClaim: ""
  storageClassName: ""
  accessModes: [ReadWriteOnce]
  size: 20Gi
  annotations: {}

# Внешний Postgres. DSN лежит в секрете (ключ dsn), см. secrets.
database:
  dsn: ""

s3:
  # Внутренний адрес S3: по нему ходят api и раннеры внутри сети кластера.
  endpoint: ""
  bucket: studio
  region: ""
  accessKey: ""
  secretKey: ""
  # Публичный адрес S3 (https://s3.example.org) для всех, кто вне сети кластера: браузеры, личные раннеры
  # и локальные Студии. Ссылки подписываются сразу для этого хоста. Пусто значит, что они получают внутренний
  # адрес и не откроют его. Как опубликовать хранилище: docs/ru/deploy/runners.md, «Раннеры вне сети сервера».
  publicEndpoint: ""
  # Как раннеры вне сети обмениваются файлами с хранилищем: presigned (ссылки на публичный адрес)
  # или proxy (поток через api, без публикации S3; нагрузка идёт через api).
  outsideRunnerAccess: presigned
  # Считать внешними и общие раннеры (по умолчанию внешние только личные).
  sharedRunnersOutside: false
  # Источники, которым бакет разрешает читать подписанные ссылки (CORS, нужен pdf.js; MinIO отвечает всем сам).
  corsOrigins: []

# Бэкапы (см. docs/ru/deploy/backups.md). При enabled=false чарт ничего не добавляет: приложение работает с
# умолчаниями, назначения и расписание админ задаёт сам в админке.
# При enabled=true чарт на первом старте создаёт назначение по умолчанию и расписание (только если назначений ещё нет:
# правки в админке рестарты переживают) и, при local.enabled, отдельный том под локальные бэкапы.
backups:
  enabled: false
  # Локальное назначение: отдельный PVC `<release>-backups`, монтируется в /backups (HSE_STUDIO__BACKUPS__LOCAL_ROOT).
  # Бэкап на том же томе, что и данные, не защищает от потери тома: берите другой класс хранения или внешний S3.
  local:
    enabled: false
    persistence:
      existingClaim: ""
      storageClassName: ""
      accessModes: [ReadWriteOnce]
      size: 50Gi
      annotations: {}
  destination:
    # local (подкаталог тома бэкапов) или s3
    kind: local
    name: default
    # kind=local: подкаталог корня /backups
    path: main
    # kind=s3: bucket обязателен, ключи ниже (или в Secret: backup-access-key, backup-secret-key)
    endpoint: ""
    region: us-east-1
    bucket: ""
    prefix: ""
    pathStyle: true
    accessKey: ""
    secretKey: ""
  schedule:
    enabled: true
    # interval (каждые intervalHours часов) или cron (пять полей, UTC)
    kind: interval
    intervalHours: 24
    cron: "0 3 * * *"
    keepLast: 7
    keepDays: 30
  # installation (ключ из SECRETS_KEY) или passphrase (парольная фраза от 12 символов в passphrase или в Secret: backup-passphrase)
  encryptionMode: installation
  passphrase: ""
  notifyAdmins: true

mail:
  host: ""
  port: 587
  username: ""
  password: ""
  fromAddress: no-reply@localhost

# Секреты. Либо существующий Secret с ключами из списка ниже, либо чарт создаст свой из значений.
# Ключи: dsn, secrets-key, s3-access-key, s3-secret-key, runner-bootstrap-token,
# а также необязательные smtp-password, health-token, metrics-token, office-jwt-secret,
# backup-access-key, backup-secret-key, backup-passphrase.
secrets:
  existingSecret: ""
  # Ключ шифрования секретов в базе (Fernet). Потеря делает сохранённые секреты нечитаемыми.
  secretsKey: ""
  runnerBootstrapToken: ""
  healthToken: ""
  metricsToken: ""
  # Общий секрет JWT реплик ONLYOFFICE; пусто значит секрет выводится из ключа шифрования.
  officeJwtSecret: ""

# Внешние реплики сервисов (в чарт не входят). Пустой список значит, что сервис недоступен.
services:
  # Адреса реплик LanguageTool, например ["http://languagetool-0.lt:8010"].
  languagetoolReplicas: []
  # Адреса реплик ONLYOFFICE Document Server.
  officeEditorReplicas: []
  # Адрес api глазами реплик ONLYOFFICE (документ и обратный вызов); пусто значит имя Service чарта.
  backendInternalUrl: ""

# Миграции схемы выполняет отдельный Job перед обновлением (helm pre-upgrade).
# На первой установке схему ведёт сам api под advisory-локом.
migrations:
  enabled: true
  backoffLimit: 1
  activeDeadlineSeconds: 600
  resources: {}

# Обновление версии из админки в Kubernetes (docs/design/auto-update.md, раздел 5a). По умолчанию выключено:
# тогда версию ставит оператор (helm upgrade --atomic или GitOps), страница «Обновления» показывает команду.
# enabled=true добавляет сервис updater со своим ServiceAccount. Его Role строго на namespace релиза: get и patch одного
# Deployment api по имени, Job (create, get, list, watch, delete), pods и pods/log только на чтение. Секреты, ClusterRole
# и чужие namespace недоступны. Снимка базы нет: перед обновлением идёт полный бэкап (раздел «Бэкапы») или нужно
# подтвердить риск; откат образа возможен, пока миграции не менялись, иначе статус «Нужны руки».
updater:
  enabled: false
  # Общий секрет api и апдейтера (Bearer). Или ключ updater-token в secrets.existingSecret.
  token: ""
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  # Сколько ждать: остановку api, миграции (Job), здоровье новой версии, старт пода Job (pull образа).
  stopTimeoutSeconds: 180
  migrateTimeoutSeconds: 3600
  healthTimeoutSeconds: 300
  podStartTimeoutSeconds: 300

ingress:
  enabled: false
  className: ""
  host: ""
  # Долгий опрос раннера держит запрос до 25 секунд: таймаут чтения не меньше 60 секунд, буферизация выключена.
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "75"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "75"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-body-size: 512m
  tls:
    enabled: false
    secretName: ""

service:
  type: ClusterIP
  port: 8000

# Раннер задач. Исполнитель сборки TeX (runner.executor):
# - docker (по умолчанию): соседние контейнеры через docker.sock узла (hostPath). Сокет эквивалентен root на узле,
#   включайте только на выделенных узлах (nodeSelector); под раннера не проходит Pod Security restricted.
# - kubernetes: под на задачу в своём namespace через Kubernetes API (ServiceAccount, Role только на поды),
#   без docker.sock и hostPath; под раннера и поды сборки проходят restricted. См. docs/design/k8s-runner.md.
runner:
  enabled: false
  executor: docker
  # Не больше 1: токен регистрации одноразовый, а в режиме docker поды узла ещё и делят hostPath.
  replicas: 1
  concurrency: 1
  tags: ""
  officeUrl: ""
  # Каталог данных раннера. В режиме docker соседние контейнеры видят пути узла, поэтому hostPath монтируется
  # по тому же пути; в режиме kubernetes это точка монтирования тома runner.persistence.
  dataDir: /var/lib/hse-runner
  dockerSocket: /var/run/docker.sock
  dockerGid: 0
  # Каталог на узле создаётся от root (hostPath, fsGroup на него не действует): раннер доходит до него
  # через initContainer, который выдаёт его пользователю podSecurityContext.
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Только executor=kubernetes: сколько ждать доработки текущих сборок при остановке пода раннера.
  terminationGracePeriodSeconds: 600
  # Только executor=kubernetes: том данных раннера (identity.json с выданным токеном, кэш блобов, рабочие папки).
  # enabled=false даёт emptyDir: тогда положите постоянный токен раннера в Secret (ключ runner-token).
  persistence:
    enabled: true
    existingClaim: ""
    storageClassName: ""
    accessModes: [ReadWriteOnce]
    size: 10Gi
  # Только executor=kubernetes: поды сборки.
  kubernetes:
    # Namespace подов сборки; пусто значит namespace релиза. Свой namespace должен существовать; пометьте его
    # pod-security.kubernetes.io/enforce=restricted.
    namespace: ""
    # Образ TeX подов; пусто значит образ раннера по умолчанию (texlive/texlive:TL2024-historic).
    image: ""
    imagePullPolicy: IfNotPresent
    # Имена Secret для pull образа TeX в namespace подов сборки.
    imagePullSecrets: []
    resources:
      requests: {cpu: 500m, memory: 1Gi}
      limits: {cpu: "2", memory: 4Gi}
    # emptyDir /work (исходники и .build) и /tmp (форматы TeX).
    workSizeLimit: 2Gi
    tmpSizeLimit: 1Gi
    # Страховка на случай смерти раннера; обычный предел времени задачи держит api.
    activeDeadlineSeconds: 1800
    # Первый pull многогигабайтного образа TeX на узле занимает минуты.
    podStartTimeoutSeconds: 300
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    nodeSelector: {}
    tolerations: []
    priorityClassName: ""
    # gvisor или kata для общих установок, если RuntimeClass есть в кластере.
    runtimeClassName: ""
    # Необязательный PVC с кэшем шрифтов TeX (/cache). Нужен ReadWriteMany либо один узел.
    texCache:
      existingClaim: ""
    # Запрет всей сети подам сборки (нужен CNI с поддержкой NetworkPolicy).
    networkPolicy:
      enabled: true
