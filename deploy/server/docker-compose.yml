# Общий сервер HSE Doc Studio: api (mode=server), раннер задач, Postgres, MinIO и сервисы проверки.
# Запуск и первый вход описаны в deploy/server/README.md:
#   cp .env.example .env   # заполнить секреты, см. комментарии в файле
#   docker compose up -d                        # минимальный набор: api, runner, postgres, minio
#   docker compose --profile services up -d     # + два LanguageTool и ONLYOFFICE
#   docker compose --profile ai up -d           # + Ollama
#   один раннер на хост и каталог данных: --scale не поддерживается (токен регистрации одноразовый)
#
# docker.sock подключён ТОЛЬКО раннеру: у api доступа к докеру нет. Сокет эквивалентен root на хосте,
# поэтому раннер-хост считается доверенной инфраструктурой (см. README, раздел «Безопасность раннера»).
name: hse-doc-studio-server

x-image: &image ghcr.io/alexeyshalaev/hse-doc-studio:${TAG:-latest}

# Логи контейнеров: без лимитов драйвер json-file растёт бесконечно (годы работы забивают диск хоста).
# По умолчанию до 5 файлов по 10 МБ на контейнер; пределы меняются LOG_MAX_SIZE и LOG_MAX_FILE в .env.
x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: "${LOG_MAX_FILE:-5}"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: studio
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging

  minio:
    # pgsty/minio: форк MinIO с возвращённой веб-консолью (в upstream после 2025-05 её убрали, образы с Docker Hub удалены).
    # Тег закреплён; в образе есть и сервер, и клиент mc.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?задайте S3_ACCESS_KEY в .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?задайте S3_SECRET_KEY в .env}
      # Метрики Prometheus: /minio/v2/metrics/cluster на порту 9000, доступном только внутри сети compose.
      # public отдаёт без токена (порт 9000 наружу не публикуется); jwt требует токен от `mc admin prometheus generate`.
      MINIO_PROMETHEUS_AUTH_TYPE: ${MINIO_PROMETHEUS_AUTH_TYPE:-public}
    # Консоль оператора только на loopback хоста: наружу её отдаёт лишь обратный прокси или SSH-туннель.
    ports:
      - "${MINIO_CONSOLE_BIND:-127.0.0.1}:${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging

  # Одноразово создаёт закрытый бакет и завершается. Клиент mc берётся из того же образа, что и сервер.
  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-studio}
    entrypoint:
      - /bin/bash
      - -c
      - >-
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" &&
        mc mb --ignore-existing "local/$$S3_BUCKET" &&
        mc anonymous set none "local/$$S3_BUCKET"
    restart: "no"
    logging: *logging

  api:
    image: *image
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-17240}:8000"
    environment: &api-env
      HSE_STUDIO__MODE: server
      HSE_STUDIO__SERVER__HOST: "0.0.0.0"
      HSE_STUDIO__SERVER__PORT: "8000"
      HSE_STUDIO__DATA_DIR: /data
      HSE_STUDIO__LOGGING__USE_JSON: "true"
      HSE_STUDIO__DB__DSN: postgresql://studio:${POSTGRES_PASSWORD}@postgres:5432/studio
      # В compose схему ведёт сам api под advisory-локом; в helm этим занят отдельный job.
      HSE_STUDIO__DB__AUTO_MIGRATE: "true"
      HSE_STUDIO__SECRETS__KEY: ${SECRETS_KEY:?задайте SECRETS_KEY в .env}
      HSE_STUDIO__S3__ENDPOINT: http://minio:9000
      HSE_STUDIO__S3__BUCKET: ${S3_BUCKET:-studio}
      HSE_STUDIO__S3__ACCESS_KEY: ${S3_ACCESS_KEY}
      HSE_STUDIO__S3__SECRET_KEY: ${S3_SECRET_KEY}
      # Публичный адрес MinIO для браузеров и раннеров вне сети compose; пусто значит, что ссылки ведут на minio:9000.
      HSE_STUDIO__S3__PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      HSE_STUDIO__S3__OUTSIDE_RUNNER_ACCESS: ${S3_OUTSIDE_RUNNER_ACCESS:-presigned}
      HSE_STUDIO__AUTH__PUBLIC_URL: ${PUBLIC_URL:?задайте PUBLIC_URL в .env}
      HSE_STUDIO__AUTH__TRUSTED_PROXIES: ${TRUSTED_PROXIES:-[]}
      HSE_STUDIO__JOBS__RUNNER_BOOTSTRAP_TOKEN: ${RUNNER_BOOTSTRAP_TOKEN:?задайте RUNNER_BOOTSTRAP_TOKEN в .env}
      HSE_STUDIO__MAIL__HOST: ${SMTP_HOST:-}
      HSE_STUDIO__MAIL__PORT: ${SMTP_PORT:-587}
      HSE_STUDIO__MAIL__USERNAME: ${SMTP_USERNAME:-}
      HSE_STUDIO__MAIL__PASSWORD: ${SMTP_PASSWORD:-}
      HSE_STUDIO__MAIL__FROM_ADDRESS: ${SMTP_FROM:-no-reply@localhost}
      # Пулы сервисов: пусто значит сервис недоступен. Для профиля services адреса даны в .env.example.
      HSE_STUDIO__LANGUAGETOOL__POOL_REPLICAS: ${LANGUAGETOOL_REPLICAS:-[]}
      HSE_STUDIO__OFFICE_EDITOR__POOL_REPLICAS: ${OFFICE_EDITOR_REPLICAS:-[]}
      HSE_STUDIO__OFFICE_EDITOR__JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-}
      HSE_STUDIO__OFFICE_EDITOR__BACKEND_INTERNAL_URL: http://api:8000
      HSE_STUDIO__OBSERVABILITY__HEALTH_TOKEN: ${HEALTH_TOKEN:-}
      HSE_STUDIO__OBSERVABILITY__METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Автообновление: api только проверяет релизы и ведёт учёт, ставит версию сервис updater (профиль updater).
      # Без UPDATER_TOKEN исполнитель выключен: Студия лишь сообщает о новых версиях.
      HSE_STUDIO__SERVER_UPDATE__EXECUTOR: compose
      HSE_STUDIO__SERVER_UPDATE__UPDATER_TOKEN: ${UPDATER_TOKEN:-}
    volumes:
      - api-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    restart: unless-stopped
    logging: *logging

  # Раннер тянет задачи у api по HTTPS (долгий опрос) и запускает TeX и проверки в соседних контейнерах.
  # Соседи видят пути ХОСТА, поэтому каталог данных монтируется по тому же пути, что и на хосте.
  runner:
    image: *image
    command: ["hse-doc-studio", "runner"]
    # Образ несёт проверку api (curl :8000/health); у процесса без HTTP она вечно unhealthy, и автообновление
    # (ждёт здоровья всех сервисов) откатывало бы каждое обновление. Отключаем её.
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy
    # Процесс идёт под непривилегированным app; без группы сокета docker отвечает permission denied.
    # Linux: gid из `stat -c '%g' /var/run/docker.sock` в DOCKER_GID. Docker Desktop: достаточно 0.
    group_add:
      - "${DOCKER_GID:-0}"
    environment:
      HSE_RUNNER__API_URL: http://api:8000
      # Нужен один раз: выданный раннеру токен сохраняется в его каталоге данных.
      HSE_RUNNER__TOKEN: ${RUNNER_BOOTSTRAP_TOKEN}
      HSE_RUNNER__DATA_DIR: ${RUNNER_DATA_DIR:-/var/lib/hse-runner}
      HSE_RUNNER__CONCURRENCY: ${RUNNER_CONCURRENCY:-1}
      HSE_RUNNER__OFFICE_URL: ${RUNNER_OFFICE_URL:-}
    volumes:
      - ${RUNNER_DATA_DIR:-/var/lib/hse-runner}:${RUNNER_DATA_DIR:-/var/lib/hse-runner}
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    logging: *logging

  # Автообновление версии (docs/design/auto-update.md): снимок базы, образ, миграции, перезапуск, проверка здоровья,
  # автоматический откат. Включается профилем: docker compose --profile updater up -d (нужен UPDATER_TOKEN в .env).
  #
  # ОПАСНО: сокет docker равен root на хосте. У апдейтера он есть, чтобы пересоздавать api и раннер; у api сокета по-прежнему
  # нет, а апдейтер слушает только исходящие запросы (портов не публикует) и принимает работу лишь от api по общему секрету.
  # Он не входит в обновляемые сервисы: сам обновляется командой `docker compose pull updater && docker compose up -d updater`.
  updater:
    profiles: [updater]
    image: *image
    command: ["python", "-m", "hse_doc_studio.infra.update.server_updater"]
    # Образ несёт проверку api (curl :8000/health); у процесса без HTTP она вечно unhealthy, и автообновление
    # (ждёт здоровья всех сервисов) откатывало бы каждое обновление. Отключаем её.
    healthcheck:
      disable: true
    group_add:
      - "${DOCKER_GID:-0}"
    environment:
      HSE_UPDATER__API_URL: http://api:8000
      HSE_UPDATER__TOKEN: ${UPDATER_TOKEN:-}
      HSE_UPDATER__SERVICES: api,runner
      HSE_UPDATER__DATA_DIR: /var/lib/hse-updater
      # Файл .env установки: после успешного обновления в нём меняется TAG, чтобы ручной `compose up` не вернул старую версию.
      # Должен быть доступен на запись пользователю app (uid 10001), иначе TAG остаётся прежним и апдейтер предупредит.
      HSE_UPDATER__ENV_FILE: /install/.env
      HSE_UPDATER__HEALTH_TOKEN: ${HEALTH_TOKEN:-}
    volumes:
      - updater-data:/var/lib/hse-updater
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.env:/install/.env
    restart: unless-stopped
    logging: *logging

  languagetool-1:
    profiles: [services]
    image: erikvl87/languagetool:6.5
    environment:
      langtool_languageModel: /ngrams
      Java_Xms: 512m
      Java_Xmx: 1g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/v2/languages"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 10
    restart: unless-stopped
    logging: *logging

  languagetool-2:
    profiles: [services]
    image: erikvl87/languagetool:6.5
    environment:
      langtool_languageModel: /ngrams
      Java_Xms: 512m
      Java_Xmx: 1g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/v2/languages"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 10
    restart: unless-stopped
    logging: *logging

  onlyoffice:
    profiles: [services]
    image: onlyoffice/documentserver:8.3
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?задайте ONLYOFFICE_JWT_SECRET в .env}
    volumes:
      - onlyoffice-data:/var/www/onlyoffice/Data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthcheck"]
      interval: 20s
      timeout: 5s
      start_period: 120s
      retries: 10
    restart: unless-stopped
    logging: *logging

  ollama:
    profiles: [ai]
    image: ollama/ollama:0.12.6
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    logging: *logging

volumes:
  pg-data:
  minio-data:
  api-data:
  updater-data:
  onlyoffice-data:
  ollama-models:
