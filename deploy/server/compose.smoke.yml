# Оверлей для приёмочного смоука (e2e/tests/full.spec.ts): тот же набор, что в deploy/server, но порт
# публикуется только на loopback.
# Для боевого развёртывания не нужен. Запуск и учётные данные: make server-stack-up (scripts/dev/server-stack/stack.sh).
# Режим регистрации в окружение не задан намеренно: его выбирает мастер первого запуска, а смоук проходит мастер.
services:
  api:
    ports: !override
      - "127.0.0.1:${PORT:-17240}:8000"
    environment:
      # Смоук самодиагностики читает публичный лёгкий эндпоинт (e2e/tests/full.spec.ts).
      HSE_STUDIO__DIAGNOSTICS__PUBLIC_ENDPOINT: "true"
      # Плановый проход чаще, чтобы страница в смоуке не ждала пять минут.
      HSE_STUDIO__DIAGNOSTICS__INTERVAL_S: "30"
