# Студия шаблонов у себя на компьютере (docs/design/template-studio.md, D2, срез T19).
#
# Тот же образ, что у Студии, в профиле standalone: стартовая страница /pack-studio, проекты
# скрыты, один локальный пользователь без входа и регистрации (локальный режим), право
# «Автор шаблонов» у него всегда. Папка паков на диске открывается рабочим пространством
# сама; репозиторий git (свой или «Официальные паки») добавляется кнопкой в интерфейсе.
#
# Запуск из папки с паками (её и откроет Студия шаблонов):
#
#   cd ~/my-packs
#   docker compose -f /путь/к/deploy/pack-studio/docker-compose.yml up -d
#
# Затем http://localhost:17260. Остановить: та же команда с `down` (данные остаются в DATA_DIR).
# Переменные (порт, папки, образ TeX) описаны в .env.example рядом.
name: hse-pack-studio

# Один путь в двух местах: бинд-маунт и HSE_STUDIO__HOST_DATA_DIR. Сборка предпросмотра идёт
# в соседнем контейнере TeX, и докеру нужен путь каталога данных на хосте, поэтому данные
# лежат в папке хоста с абсолютным путём, а не в именованном томе.
x-data-dir: &data_dir "${DATA_DIR:-${HOME:-${USERPROFILE:?задайте DATA_DIR в .env}}/.hse-pack-studio}"
# Папка паков: по умолчанию та, откуда запущена команда (compose подставляет PWD сам).
x-packs-dir: &packs_dir "${PACKS_DIR:-${PWD}}"

services:
  pack-studio:
    image: ghcr.io/alexeyshalaev/hse-doc-studio:${TAG:-latest}
    restart: unless-stopped
    # Linux: процесс пишет в папку паков и в DATA_DIR, поэтому запускайте его своим uid
    # (HSE_UID=$(id -u) HSE_GID=$(id -g)). Docker Desktop (macOS, Windows) права сам сопоставляет.
    user: "${HSE_UID:-10001}:${HSE_GID:-10001}"
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: "${LOG_MAX_FILE:-5}"
    # Локальный режим без входа: по умолчанию слушаем только эту машину.
    ports:
      - "${BIND:-127.0.0.1}:${PORT:-17260}:8000"
    # Сокет докера нужен сборке предпросмотра (контейнер TeX рядом). Docker Desktop отдаёт
    # сокет root:root, на Linux подставьте gid группы docker: stat -c '%g' /var/run/docker.sock.
    group_add:
      - "${DOCKER_GID:-0}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HSE_STUDIO__SERVER__HOST: "0.0.0.0"
      HSE_STUDIO__SERVER__PORT: "8000"
      HSE_STUDIO__DATA_DIR: "/data"
      HSE_STUDIO__HOST_DATA_DIR: *data_dir
      HSE_STUDIO__STATIC_DIR: "/app/static"
      HSE_STUDIO__LOGGING__USE_JSON: "true"
      # Профиль Студии шаблонов: раздел включён, стартовая страница /pack-studio.
      HSE_STUDIO__PACK_STUDIO__STANDALONE: "true"
      HSE_STUDIO__PACK_STUDIO__STANDALONE_FOLDER: "/packs"
      # Папка паков видна Студии как /packs, а в интерфейсе под своим путём на хосте.
      HSE_STUDIO__COMPILE__PROJECTS_CONTAINER_PATH: "/packs"
      HSE_STUDIO__COMPILE__PROJECTS_HOST_PATH: *packs_dir
      # Образ TeX Live для сборки предпросмотра, как у локальной Студии (у latest есть arm64 для Apple Silicon).
      HSE_STUDIO__COMPILE__IMAGE: "${TEX_IMAGE:-texlive/texlive:latest}"
      # Скачать образ TeX фоном сразу после старта; false: при первой сборке предпросмотра.
      HSE_STUDIO__COMPILE__PREFETCH_IMAGE: "${TEX_PREFETCH:-true}"
      HSE_STUDIO__UPDATE_FEED_URL: "${UPDATE_FEED_URL:-}"
      HSE_STUDIO__FONTS__HOST_DIR: "${HOST_FONTS_DIR:-}"
    volumes:
      - type: bind
        source: *data_dir
        target: /data
        bind:
          create_host_path: true
      - type: bind
        source: *packs_dir
        target: /packs
      - /var/run/docker.sock:/var/run/docker.sock
