[project]
name = "hse-doc-studio"
version = "0.1.3" # x-release-please-version
description = "hse-doc-studio Service (REST API)"
authors = [{ name = "Alexey Shalaev", email = "shalaevad.alexey@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.0",
    "gitpython>=3.1",
    "httpx>=0.28",
    "dishka>=1.4",
    "sse-starlette>=2.2",
    "structlog>=25.0",
    "orjson>=3.10",
    "uvloop>=0.22.1; sys_platform != 'win32'",
    "cryptography>=44.0",
    "pypdf>=5.0",
    "reportlab>=4.2",
    "pyHanko[image-support]>=0.25",
    "openai>=1.0",
    "anthropic>=0.40",
    "psutil>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["hse_doc_studio"]

[tool.hatch.metadata]
allow-direct-references = true

[project.optional-dependencies]
api = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.32",
]

test = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "httpx>=0.28",
    "pytest-lazy-fixtures>=1.4.0",
    "pytest-mock>=3.14.0",
    "pytest-httpx>=0.35.0",
    "pytest-timeout>=2.3.1",
    "faker>=33.0",
    "freezegun>=1.5.1",
    "dirty-equals>=0.9.0",
]

dev = [
    "ruff>=0.14.11",
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "types-PyYAML>=6.0",
]

[tool.ruff]
line-length = 120
src = ["hse_doc_studio", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "C90", # mccabe
    "F",   # pyflakes
    "E",   # pycodestyle
    "I",   # isort
    "B",   # bugbear
    "N",   # pep8-naming
    "S",   # bandit
    "G",   # logging format
    "T10",
    "PL",
    "C4",  # comprehensions
    "DTZ", # datetimez
    "FA",  # future-annotations
    "ISC", # implicit string concat
    "PT",  # flake8-pytest-style
    "SIM", # flake8-simplify
    "ERA", # flake8-eradicate
    "TRY", # tryceratops
    "FIX", # todos
    "TID", # tidy-imports
    "PERF", # known performance issues checks
    "T201", # flake8-print
    "RUF006", # asyncio-dangling-task
    "RUF022", # unsorted-all
    "RUF023", # unsorted-all-items
]
ignore = [
    "G004",    # Logging statement uses f-string — structlog handles this safely
    "B008",    # Do not perform function call `Depends` in argument defaults — FastAPI pattern
    "FIX002",  # Line contains todo — we explicitly disallow TODO markers via project rules
    "C408",    # Unnecessary `dict` call — dict(...) is clearer than {...} for kwargs passthrough
    "ISC001",  # Implicit string concat — conflicts with the formatter
    "PT004",   # Fixture does not return anything — convention incompatibility
    "TID252",  # Prefer absolute imports over relative — domain modules use relative by design
    "TID251",  # `typing.Optional` is banned — we enforce `| None` via explicit banned-api below
    "N802",    # Function name should be lowercase — keep FastAPI decorator callables PascalCase-friendly
    "TRY003",  # Long exception message — acceptable for domain errors
    "TRY301",  # Raise within try — acceptable in streaming handlers
    "PLR0913", # Too many arguments — use cases may require several deps
    "PLR2004", # Magic value used in comparison — acceptable in domain code
]

[tool.ruff.lint.mccabe]
max-complexity = 7

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "ASYNC",
    "PL",
    "PERF",
    "S",
    "PT005",
]
# scripts/ — автономные dev-утилиты, запускаемые вручную (`uv run python scripts/…`),
# а не часть поставляемого пакета. Печать в stdout — их назначение, а не отладочный
# мусор; ограничения на сложность к одноразовому main-у не применяем.
"scripts/*" = [
    "T201",    # print — это и есть вывод CLI-скрипта
    "C901",    # сложность main-а скрипта
    "PLR0912", # too many branches
    "PLR0915", # too many statements
]

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Set".msg = "Use set[] instead."
"typing.List".msg = "Use list[] instead."
"typing.Dict".msg = "Use dict[] instead."
"typing.Optional".msg = "Use | None instead."
"typing.Type".msg = "Use type[] instead."
"typing.Union".msg = "Use | instead."


[tool.mypy]
# Пути относительны каталога, из которого запускается mypy, а он всегда этот
# (CI, `make check`, pre-commit — все делают `cd services/api`).
# Раньше здесь стояли пути от корня монорепы: mypy_path указывал в никуда, а files
# перекрывался явным аргументом и потому не срабатывал.
mypy_path = "."
files = ["hse_doc_studio"]
# Проверяем НИЖНЮЮ границу requires-python (>=3.12), а не рантайм CI (3.14):
# код обязан оставаться совместимым с самой старой поддерживаемой версией.
python_version = "3.12"
plugins = ["pydantic.mypy"]
# Strict checks
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
# might be useful if used in the same scope
allow_untyped_calls = true
allow_redefinition = true
disallow_untyped_decorators = false
implicit_reexport = false
ignore_missing_imports = true
show_error_codes = true
warn_return_any = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["tests.*", "hse_doc_studio.infra.di.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true


[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

testpaths = ["tests"]
pythonpath = ["."]

markers = [
    "unit: mark a test as a unit test.",
    "integration: mark a test as an integration test.",
    "http: mark a test as an HTTP integration test.",
]

addopts = """
    -v
    --strict-markers
    --tb=short
    --timeout=30
    --cov=hse_doc_studio
    --cov-report=term
    --cov-report=xml:coverage.xml
    --junitxml=rspec.xml
"""

[tool.coverage.run]
omit = [
    "tests/*",
    "*/test_*.py",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
