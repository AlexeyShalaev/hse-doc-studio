# Только для ручной работы с alembic из services/api (DSN берётся из HSE_STUDIO__DB__DSN).
# Приложение и `hse-doc-studio db ...` собирают конфиг в коде: infra/db/migrator.py.
[alembic]
script_location = hse_doc_studio/infra/db/migrations
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
prepend_sys_path = .
