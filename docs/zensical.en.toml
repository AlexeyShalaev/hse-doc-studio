# English site config: docs/en → docs/site/en .
# Shared assets (stylesheets, javascripts, fonts, brand, shots) are copied from
# docs/ru into docs/en by scripts/docs/sync_shared.py before the build — the
# copies are gitignored, docs/ru is the single source of truth.
# Build order matters: RU first (with --clean), then this config WITHOUT --clean.

[project]
site_name = "HSE Doc Studio"
site_description = "A local studio for academic documents: GOST-compliant thesis and coursework — templates, containerized LaTeX builds, normcontrol checks, signatures and submission packaging. No cloud, no accounts."
site_author = "Alexey Shalaev"
site_url = "https://alexeyshalaev.github.io/hse-doc-studio/en/"
repo_name = "AlexeyShalaev/hse-doc-studio"
repo_url = "https://github.com/AlexeyShalaev/hse-doc-studio"
edit_uri = "edit/master/docs/en/"
copyright = "© 2026 Alexey Shalaev · Apache-2.0"
docs_dir = "en"
site_dir = "site/en"

extra_css = [
    "stylesheets/00-fonts.css",
    "stylesheets/01-tokens.css",
    "stylesheets/02-typography.css",
    "stylesheets/03-chrome.css",
    "stylesheets/04-layout.css",
    "stylesheets/05-components.css",
    "stylesheets/06-shots.css",
    "stylesheets/07-print.css",
]
extra_javascript = ["javascripts/hds.js"]

nav = [
    { "Home" = "index.md" },
    { "Getting started" = [
        { "Where to start" = "start/index.md" },
        { "Installation" = "start/install.md" },
        { "First project" = "start/first-project.md" },
        { "Updating and uninstalling" = "start/update.md" },
        { "Troubleshooting" = "start/troubleshooting.md" },
    ] },
    { "Workbench" = [
        { "Workbench overview" = "workbench/index.md" },
        { "Documents" = "workbench/documents.md" },
        { "Build and log" = "workbench/compile.md" },
        { "Findings" = "workbench/checks.md" },
        { "Submission packaging" = "workbench/submit.md" },
        { "PDF preview" = "workbench/preview.md" },
        { "Visual editor" = "workbench/editor-visual.md" },
        { "AI agent" = "workbench/agent.md" },
    ] },
    { "Reference" = [
        { "Reference map" = "reference/index.md" },
        { "Packs and templates" = "reference/pack.md" },
        { "Documents" = "reference/documents.md" },
        { "Checks and rules" = "reference/checks-rules.md" },
        { "Submission profiles" = "reference/checkpoints.md" },
        { "Glossary" = "reference/glossary.md" },
        { "On-disk layout" = "reference/layout.md" },
        { "What goes over the network" = "reference/privacy.md" },
    ] },
    { "What's new" = "whatsnew/index.md" },
]

[project.theme]
custom_dir = "overrides"
language = "en"
font = false
logo = "assets/brand/mark.svg"
favicon = "assets/brand/favicon.svg"
features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.tabs.link",
    "content.tooltips",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.sections",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "search.share",
    "search.suggest",
    "toc.follow",
]

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Light mode"

[[project.extra.alternate]]
name = "Русский"
link = "https://alexeyshalaev.github.io/hse-doc-studio/"
lang = "ru"

[[project.extra.alternate]]
name = "English"
link = "https://alexeyshalaev.github.io/hse-doc-studio/en/"
lang = "en"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/AlexeyShalaev/hse-doc-studio"

[project.plugins.macros]
module_name = "docs_macros"
render_by_default = false
on_undefined = "strict"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = "§"
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.snippets]
base_path = ["docs/ru/_snippets"]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
